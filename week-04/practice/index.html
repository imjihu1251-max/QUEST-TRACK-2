<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딸기 모으기 (연습 게임)</title>
<style>
  html, body { margin: 0; height: 100%; background: #14121c; color: #ddd; font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; max-width: 100vw; }
  #credit { font-size: 12px; color: #999; margin-top: 6px; text-align: center; padding: 0 8px; }
  #credit a { color: #bbb; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="credit">
  Pixel Art Bosses by Admurin (<a href="https://admurin.itch.io/" target="_blank">https://admurin.itch.io/</a>) - CC-BY 4.0 -
  <a href="https://opengameart.org/content/pixel-art-bosses" target="_blank">https://opengameart.org/content/pixel-art-bosses</a>
</div>
<script>
// ===== 화면 =====
// 게임 안의 크기는 480×270. 캔버스는 그 두 배(960×540)라서 2배로 그린다.
const VIEW_W = 480, VIEW_H = 270, PIXEL = 2;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  const s = Math.max(1, Math.min(window.innerWidth / VIEW_W, (window.innerHeight - 40) / VIEW_H));
  canvas.style.width = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ===== 에셋 (Lectio Drop) =====
// drop.json 의 프레임 정보를 그대로 옮겨 적었다.
// (index.html 을 두 번 눌러 열면 브라우저가 drop.json 을 읽지 못하게 막아서, 여기 직접 적어 둠)
const IMAGE_DIR = 'assets/images/';
const ANIMS = {
  slime:        { file: 'green-slime-ghost.png',   fw: 16,  fh: 16,  frames: 1,  fps: 1,  loop: true  },
  chest:        { file: 'chest.png',               fw: 16,  fh: 16,  frames: 1,  fps: 1,  loop: true  },
  mud_idle:     { file: 'mud-blob_idle.png',       fw: 16,  fh: 16,  frames: 4,  fps: 10, loop: true  },
  skel_idle:    { file: 'skeleton_idle.png',       fw: 16,  fh: 16,  frames: 4,  fps: 10, loop: true  },
  skel_run:     { file: 'skeleton_run.png',        fw: 16,  fh: 16,  frames: 4,  fps: 14, loop: true  },
  goal_open:    { file: 'treasure-chest_open.png', fw: 16,  fh: 16,  frames: 3,  fps: 10, loop: false },
  skull_fly:    { file: 'fire-skull_fly.png',      fw: 96,  fh: 112, frames: 8,  fps: 12, loop: true  },
  boss_idle:    { file: 'gollux_idle.png',         fw: 108, fh: 92,  frames: 5,  fps: 12, loop: true  },
  boss_walk:    { file: 'gollux_walk.png',         fw: 108, fh: 92,  frames: 8,  fps: 12, loop: true  },
  boss_attack:  { file: 'gollux_attack.png',       fw: 108, fh: 92,  frames: 19, fps: 12, loop: false },
  boss_hit:     { file: 'gollux_hit.png',          fw: 108, fh: 92,  frames: 4,  fps: 12, loop: false },
  wisp_idle:    { file: 'wispy-fire_idle.png',     fw: 32,  fh: 32,  frames: 21, fps: 10, loop: true  },
  wisp_hit:     { file: 'wispy-fire_hit.png',      fw: 32,  fh: 32,  frames: 5,  fps: 12, loop: false },
  wisp_death:   { file: 'wispy-fire_death.png',    fw: 32,  fh: 32,  frames: 10, fps: 10, loop: false },
};
const images = {};
const loadErrors = [];

function preload() {
  const files = [...new Set(Object.values(ANIMS).map(a => a.file))];
  return Promise.all(files.map(file => new Promise(resolve => {
    const img = new Image();
    img.onload = () => { images[file] = img; resolve(); };
    img.onerror = () => { loadErrors.push(file); resolve(); };
    img.src = IMAGE_DIR + file;
  })));
}

// 애니메이션이 시작한 지 t 초 지났을 때 몇 번째 프레임인지
function frameAt(anim, t) {
  const f = Math.floor(t * anim.fps);
  return anim.loop ? f % anim.frames : Math.min(f, anim.frames - 1);
}
function animDone(anim, t) {
  return !anim.loop && t * anim.fps >= anim.frames;
}

// 시트에서 한 프레임을 잘라 그린다. (x, y) = 그림 왼쪽 위 (게임 좌표)
function drawFrame(name, t, x, y, flip = false, scale = 1, alpha = 1) {
  const a = ANIMS[name];
  const img = images[a.file];
  if (!img) return;
  const f = frameAt(a, t);
  const w = a.fw * scale, h = a.fh * scale;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(x - camX), Math.round(y));
  if (flip) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, f * a.fw, 0, a.fw, a.fh, 0, 0, w, h);
  ctx.restore();
}

// ===== 코드로 그린 그림 (딸기, 하트) — 에셋에 없어서 직접 그림 =====
const STRAWBERRY = [
  '...gg...',
  '..gGGg..',
  '.rrggrr.',
  'rrRrrRrr',
  'rrrrrrrr',
  '.rRrrRr.',
  '..rrrr..',
  '...rr...',
];
const HEART = [
  '.rr.rr.',
  'rRrrrrr',
  'rrrrrrr',
  '.rrrrr.',
  '..rrr..',
  '...r...',
];
const PIXEL_COLORS = { g: '#3fa34d', G: '#7ed957', r: '#e23b3b', R: '#ffd36b' };
function drawPixels(rows, x, y, colors = PIXEL_COLORS) {
  for (let j = 0; j < rows.length; j++)
    for (let i = 0; i < rows[j].length; i++) {
      const c = rows[j][i];
      if (c === '.') continue;
      ctx.fillStyle = colors[c];
      ctx.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
    }
}

// ===== 입력 =====
const keys = {};
let jumpPressed = false;
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !keys.Space) jumpPressed = true;
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') { startGame(); jumpPressed = false; }
  if (e.code === 'KeyR') startGame();
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ===== 맵 =====
const LEVEL_W = 3250;
const GROUND_Y = 230;
const FALL_Y = 320;
const solids = [
  // 땅 (사이사이 구멍)
  { x: 0,    y: GROUND_Y, w: 610,  h: 40 },
  { x: 666,  y: GROUND_Y, w: 544,  h: 40 },
  { x: 1266, y: GROUND_Y, w: 644,  h: 40 },
  { x: 1966, y: GROUND_Y, w: 1284, h: 40 },
  // 떠 있는 발판
  { x: 200,  y: 185, w: 64, h: 12 },
  { x: 330,  y: 145, w: 64, h: 12 },
  { x: 470,  y: 185, w: 48, h: 12 },
  { x: 760,  y: 180, w: 80, h: 12 },
  { x: 900,  y: 140, w: 64, h: 12 },
  { x: 1050, y: 180, w: 64, h: 12 },
  { x: 1350, y: 185, w: 64, h: 12 },
  { x: 1480, y: 145, w: 64, h: 12 },
  { x: 1620, y: 105, w: 64, h: 12 },
  { x: 1760, y: 160, w: 64, h: 12 },
  { x: 2100, y: 180, w: 96, h: 12 },
  { x: 2280, y: 140, w: 64, h: 12 },
  // 보스 방: 계단 발판 (보스 머리 위로 뛰어내리려고)
  { x: 2470, y: 190, w: 40, h: 12 },
  { x: 2540, y: 150, w: 56, h: 12 },
  { x: 2880, y: 190, w: 40, h: 12 },
  { x: 2950, y: 150, w: 56, h: 12 },
];
const CHECKPOINTS = [40, 700, 1300, 2020, 2420];
const BOSS_ROOM = { left: 2440, right: 3060 };

// ===== 게임 상태 =====
let state = 'title';   // title / play / clear / over
let camX = 0;
let time = 0;
let player, enemies, berries, items, boss, goal, popups, berryTotal, berryCount, message, messageT;

function makePlayer(x) {
  return { x, y: GROUND_Y, vx: 0, vy: 0, w: 8, h: 13, onGround: false, facing: 1,
           coyote: 0, jumpBuf: 0, hurtT: 0, animT: 0, anim: 'skel_idle' };
}

function startGame() {
  state = 'play';
  time = 0;
  player = makePlayer(CHECKPOINTS[0]);
  player.lives = 3;
  popups = [];
  message = ''; messageT = 0;

  // 딸기 위치 (x, 발이 닿는 높이 위로 조금)
  const spots = [
    [120, 215], [160, 215], [232, 170], [362, 130], [494, 170], [560, 215],
    [640, 170], [800, 165], [932, 125], [1082, 165], [1150, 215], [1240, 175],
    [1382, 170], [1512, 130], [1636, 90], [1792, 145], [1860, 215], [1950, 160],
    [2148, 165], [2296, 125], [2568, 135], [2978, 135],
  ];
  berries = spots.map(([x, y]) => ({ x, y, taken: false }));
  berryTotal = berries.length;
  berryCount = 0;

  // 작은 보물 상자: 하트 +1
  items = [{ x: 1672, y: 105, taken: false }, { x: 2330, y: 140, taken: false }];

  enemies = [
    { type: 'slime', x: 420,  minX: 380,  maxX: 570,  dir: 1,  speed: 25 },
    { type: 'slime', x: 1120, minX: 1080, maxX: 1190, dir: -1, speed: 30 },
    { type: 'slime', x: 2150, minX: 2040, maxX: 2260, dir: 1,  speed: 35 },
    { type: 'mud',   x: 720,  minX: 690,  maxX: 880,  dir: 1,  speed: 18 },
    { type: 'mud',   x: 1450, minX: 1400, maxX: 1600, dir: -1, speed: 20 },
    { type: 'mud',   x: 1750, minX: 1700, maxX: 1880, dir: 1,  speed: 22 },
    { type: 'wisp',  x: 638,  baseY: 200, hp: 2 },
    { type: 'wisp',  x: 1238, baseY: 205, hp: 2 },
    { type: 'wisp',  x: 1938, baseY: 200, hp: 2 },
    { type: 'skull', x: 1000, minX: 880,  maxX: 1280, baseY: 70, dir: -1, speed: 55 },
    { type: 'skull', x: 1700, minX: 1480, maxX: 1980, baseY: 55, dir: 1,  speed: 65 },
  ];
  for (const e of enemies) { e.t = Math.random() * 3; e.y = e.baseY || GROUND_Y; e.dead = false; e.state = 'idle'; e.stateT = 0; }

  boss = { x: 2800, y: GROUND_Y, hp: 3, facing: -1, state: 'idle', stateT: 0, hurtCool: 0, gone: false, fade: 1, attackHit: false };
  goal = { x: 3130, y: GROUND_Y, opened: false, openT: 0 };
}

// ===== 충돌 =====
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
// 플레이어 몸 상자 (x 는 가운데, y 는 발바닥)
function playerBox() { return { x: player.x - player.w / 2, y: player.y - player.h, w: player.w, h: player.h }; }

// 떠 있는 발판은 밑에서 뛰어 통과하고 위에만 설 수 있다. 땅은 사방이 막혀 있다.
const isFloating = s => s.y !== GROUND_Y;

function moveAndCollide(dt) {
  const p = player;
  // 가로로 움직이고 벽에 막히기
  p.x += p.vx * dt;
  p.x = Math.max(6, Math.min(LEVEL_W - 6, p.x));
  for (const s of solids) {
    if (isFloating(s)) continue;
    const b = playerBox();
    if (!overlap(b, s)) continue;
    if (p.vx > 0) p.x = s.x - p.w / 2;
    else if (p.vx < 0) p.x = s.x + s.w + p.w / 2;
  }
  // 세로로 움직이고 바닥·천장에 막히기
  const prevY = p.y;
  p.y += p.vy * dt;
  p.onGround = false;
  for (const s of solids) {
    const b = playerBox();
    if (!overlap(b, s)) continue;
    if (isFloating(s)) {
      if (p.vy >= 0 && prevY <= s.y + 0.01) { p.y = s.y; p.vy = 0; p.onGround = true; }
      continue;
    }
    if (p.vy >= 0) { p.y = s.y; p.vy = 0; p.onGround = true; }
    else { p.y = s.y + s.h + p.h; p.vy = 0; }
  }
}

// ===== 업데이트 =====
const GRAVITY = 900, MOVE_SPEED = 110, JUMP_V = 330;

function hurtPlayer(fromX) {
  if (player.hurtT > 0) return;
  player.lives--;
  player.hurtT = 1.2;
  player.vy = -200;
  player.vx = player.x < fromX ? -120 : 120;
  if (player.lives <= 0) state = 'over';
}

function bounce() { player.vy = keys.Space ? -300 : -220; player.canCut = false; }

function respawn() {
  player.lives--;
  if (player.lives <= 0) { state = 'over'; return; }
  const cp = CHECKPOINTS.filter(c => c < player.x).pop() || CHECKPOINTS[0];
  const lives = player.lives;
  player = makePlayer(cp);
  player.lives = lives;
  player.hurtT = 1.2;
}

function update(dt) {
  time += dt;
  if (state !== 'play') { if (goal && goal.opened) goal.openT += dt; return; }
  const p = player;

  // 좌우 이동
  const dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  if (p.hurtT > 0.9) {
    // 맞은 직후 잠깐은 밀려남
  } else {
    p.vx = dir * MOVE_SPEED;
    if (dir) p.facing = dir;
  }

  // 점프 (땅에서 살짝 벗어나도, 착지 직전에 눌러도 뛰게)
  p.coyote = p.onGround ? 0.08 : p.coyote - dt;
  p.jumpBuf = jumpPressed ? 0.1 : p.jumpBuf - dt;
  jumpPressed = false;
  if (p.jumpBuf > 0 && p.coyote > 0) { p.vy = -JUMP_V; p.jumpBuf = 0; p.coyote = 0; p.canCut = true; }
  if (p.canCut && !keys.Space && p.vy < -120) p.vy = -120;   // 스페이스를 빨리 떼면 낮게 뜀
  if (p.vy >= 0) p.canCut = false;

  p.vy = Math.min(p.vy + GRAVITY * dt, 500);
  const prevBottom = p.y;
  moveAndCollide(dt);
  if (p.hurtT > 0) p.hurtT -= dt;
  if (p.y > FALL_Y) { respawn(); return; }

  // 애니메이션: 달리기 / 대기
  const nextAnim = Math.abs(p.vx) > 1 ? 'skel_run' : 'skel_idle';
  if (nextAnim !== p.anim) { p.anim = nextAnim; p.animT = 0; }
  p.animT += dt;

  const pb = playerBox();

  // 딸기
  for (const b of berries) {
    if (b.taken) continue;
    if (overlap(pb, { x: b.x, y: b.y, w: 8, h: 8 })) {
      b.taken = true; berryCount++;
      popups.push({ x: b.x, y: b.y, text: '+1', t: 0 });
    }
  }
  // 작은 보물 상자 → 하트
  for (const it of items) {
    if (it.taken) continue;
    if (overlap(pb, { x: it.x - 8, y: it.y - 16, w: 16, h: 16 })) {
      it.taken = true;
      player.lives = Math.min(5, player.lives + 1);
      popups.push({ x: it.x - 10, y: it.y - 20, text: '하트 +1', t: 0 });
    }
  }

  // 적
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt; e.stateT += dt;
    let box;
    if (e.type === 'slime' || e.type === 'mud') {
      e.x += e.dir * e.speed * dt;
      if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
      if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
      box = e.type === 'slime' ? { x: e.x - 6, y: GROUND_Y - 12, w: 12, h: 12 } : { x: e.x - 7, y: GROUND_Y - 12, w: 14, h: 12 };
    } else if (e.type === 'wisp') {
      if (e.state === 'death') {
        if (animDone(ANIMS.wisp_death, e.stateT)) e.dead = true;
        continue;
      }
      if (e.state === 'hit' && animDone(ANIMS.wisp_hit, e.stateT)) { e.state = 'idle'; e.stateT = 0; }
      e.y = e.baseY + Math.sin(e.t * 2) * 14;
      box = { x: e.x - 7, y: e.y - 24, w: 14, h: 22 };
    } else if (e.type === 'skull') {
      e.x += e.dir * e.speed * dt;
      if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
      if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
      e.y = e.baseY + Math.sin(e.t * 2.5) * 35;
      box = { x: e.x - 11, y: e.y - 11, w: 22, h: 22 };
    }
    if (!overlap(pb, box)) continue;

    const stomp = p.vy > 0 && prevBottom <= box.y + 6 && e.type !== 'skull';
    if (stomp) {
      bounce();
      if (e.type === 'wisp') {
        if (e.state === 'hit') continue;
        e.hp--;
        e.state = e.hp > 0 ? 'hit' : 'death';
        e.stateT = 0;
      } else {
        e.dead = true;
        popups.push({ x: e.x - 8, y: GROUND_Y - 24, text: '퐁!', t: 0 });
      }
    } else if (!(e.type === 'wisp' && e.state === 'hit')) {
      hurtPlayer(e.x);
    }
  }

  updateBoss(dt, pb, prevBottom);

  // 마지막 보물상자
  if (overlap(pb, { x: goal.x - 16, y: goal.y - 32, w: 32, h: 32 })) {
    if (boss.gone) { goal.opened = true; goal.openT = 0; state = 'clear'; }
    else showMessage('바위 거인을 먼저 물리쳐!');
  }

  for (const pp of popups) pp.t += dt;
  popups = popups.filter(pp => pp.t < 0.8);
  if (messageT > 0) messageT -= dt;

  // 카메라
  camX = Math.max(0, Math.min(LEVEL_W - VIEW_W, p.x - VIEW_W * 0.4));
}

function showMessage(text) { message = text; messageT = 1.5; }

// 보스: 그림 속 몸 가운데는 프레임 왼쪽에서 35칸, 몸 너비 약 60, 키 약 60
const BOSS_BODY_CX = 35;
function bossFrameLeft() {
  return boss.facing > 0 ? boss.x - BOSS_BODY_CX : boss.x - (108 - BOSS_BODY_CX);
}
function bossBox() { return { x: boss.x - 28, y: GROUND_Y - 58, w: 56, h: 58 }; }

function setBossState(s) { boss.state = s; boss.stateT = 0; boss.attackHit = false; }

function updateBoss(dt, pb, prevBottom) {
  if (boss.gone) return;
  boss.stateT += dt;
  if (boss.hurtCool > 0) boss.hurtCool -= dt;

  if (boss.state === 'dying') {
    boss.fade = Math.max(0, 1 - boss.stateT / 1.2);
    if (boss.fade <= 0) { boss.gone = true; showMessage('바위 거인을 물리쳤다! 보물상자로 가자'); }
    return;
  }

  const inRoom = player.x > BOSS_ROOM.left;
  const dx = player.x - boss.x;

  if (boss.state === 'idle') {
    if (inRoom && boss.stateT > 0.6) setBossState('walk');
  } else if (boss.state === 'walk') {
    boss.facing = dx > 0 ? 1 : -1;
    boss.x += boss.facing * 32 * dt;
    boss.x = Math.max(BOSS_ROOM.left + 120, Math.min(BOSS_ROOM.right - 40, boss.x));
    if (Math.abs(dx) < 60 && player.y > GROUND_Y - 40) setBossState('attack');
    if (!inRoom) setBossState('idle');
  } else if (boss.state === 'attack') {
    // 주먹을 뻗는 프레임(5~8)에만 앞쪽이 아픔
    const f = frameAt(ANIMS.boss_attack, boss.stateT);
    if (f >= 5 && f <= 8 && !boss.attackHit) {
      const fist = boss.facing > 0
        ? { x: boss.x + 15, y: GROUND_Y - 50, w: 55, h: 50 }
        : { x: boss.x - 70, y: GROUND_Y - 50, w: 55, h: 50 };
      if (overlap(pb, fist)) { hurtPlayer(boss.x); boss.attackHit = true; }
    }
    if (animDone(ANIMS.boss_attack, boss.stateT)) setBossState('idle');
  } else if (boss.state === 'hit') {
    if (animDone(ANIMS.boss_hit, boss.stateT)) setBossState(boss.hp > 0 ? 'walk' : 'dying');
  }

  // 머리 밟기 / 몸에 부딪힘
  const bb = bossBox();
  if (overlap(pb, bb)) {
    const stomp = player.vy > 0 && prevBottom <= bb.y + 8;
    if (stomp && boss.hurtCool <= 0) {
      bounce(); player.vy = -320;
      boss.hp--; boss.hurtCool = 0.6;
      setBossState('hit');
      popups.push({ x: boss.x - 10, y: bb.y - 10, text: boss.hp > 0 ? `남은 힘 ${boss.hp}` : '쿵!', t: 0 });
    } else if (!stomp) {
      hurtPlayer(boss.x);
    }
  }
}

// ===== 그리기 =====
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, '#2b2d5c'); g.addColorStop(1, '#7a5c8f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // 별
  ctx.fillStyle = '#fff8';
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 97 - camX * 0.1) % VIEW_W + VIEW_W) % VIEW_W;
    ctx.fillRect(Math.round(sx), (i * 53) % 120, 1, 1);
  }
  // 먼 언덕 (천천히 움직임)
  for (const [speed, color, base, amp] of [[0.2, '#3c3563', 170, 25], [0.45, '#2a2547', 195, 18]]) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, VIEW_H);
    for (let x = 0; x <= VIEW_W; x += 8) {
      const wx = x + camX * speed;
      ctx.lineTo(x, base - Math.sin(wx / 60) * amp - Math.sin(wx / 23) * amp * 0.3);
    }
    ctx.lineTo(VIEW_W, VIEW_H); ctx.fill();
  }
}

function drawSolids() {
  for (const s of solids) {
    const x = Math.round(s.x - camX);
    if (x > VIEW_W || x + s.w < 0) continue;
    ctx.fillStyle = '#5b3d2e'; ctx.fillRect(x, s.y, s.w, s.h);
    ctx.fillStyle = '#4a3024';
    for (let i = 4; i < s.w; i += 12) ctx.fillRect(x + i, s.y + 6 + (i % 3) * 3, 3, 2);
    ctx.fillStyle = '#5fb04a'; ctx.fillRect(x, s.y, s.w, 3);
    ctx.fillStyle = '#8fdc6a'; ctx.fillRect(x, s.y, s.w, 1);
  }
}

function drawWorld() {
  // 딸기
  for (const b of berries) {
    if (b.taken) continue;
    drawPixels(STRAWBERRY, b.x - camX, b.y + Math.sin(time * 3 + b.x) * 1.5);
  }
  // 작은 보물 상자 (하트)
  for (const it of items) {
    if (it.taken) continue;
    drawFrame('chest', 0, it.x - 8, it.y - 16 + Math.sin(time * 2) * 1);
  }
  // 마지막 보물상자 (2배 크기, 열리는 애니메이션)
  drawFrame('goal_open', goal.opened ? goal.openT : 0, goal.x - 16, goal.y - 32, false, 2);

  // 적
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.type === 'slime') {
      const squash = Math.abs(Math.sin(e.t * 6)) * 2;
      drawFrame('slime', 0, e.x - 8, GROUND_Y - 16 + squash, e.dir < 0);
    } else if (e.type === 'mud') {
      drawFrame('mud_idle', e.t, e.x - 8, GROUND_Y - 16, e.dir < 0);
    } else if (e.type === 'wisp') {
      const name = e.state === 'death' ? 'wisp_death' : e.state === 'hit' ? 'wisp_hit' : 'wisp_idle';
      drawFrame(name, e.state === 'idle' ? e.t : e.stateT, e.x - 16, e.y - 31);
    } else if (e.type === 'skull') {
      // 그림이 왼쪽을 보고 있어서 오른쪽으로 갈 때 뒤집음. 0.5배로 줄여 그림
      drawFrame('skull_fly', e.t, e.x - 22, e.y - 32, e.dir > 0, 0.5);
    }
  }

  // 보스
  if (!boss.gone) {
    const name = { idle: 'boss_idle', walk: 'boss_walk', attack: 'boss_attack', hit: 'boss_hit', dying: 'boss_hit' }[boss.state];
    const t = boss.state === 'dying' ? 10 : boss.stateT;
    const blink = boss.state === 'dying' && Math.floor(boss.stateT * 12) % 2 === 0 ? 0.3 : 1;
    drawFrame(name, t, bossFrameLeft(), GROUND_Y - 92, boss.facing < 0, 1, boss.fade * blink);
  }

  // 플레이어 (맞은 뒤 무적일 때 깜빡임)
  const p = player;
  if (!(p.hurtT > 0 && Math.floor(p.hurtT * 15) % 2 === 0)) {
    drawFrame(p.anim, p.animT, p.x - 8, p.y - 16, p.facing < 0);
  }

  // +1 같은 글자
  ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'left';
  for (const pp of popups) {
    ctx.fillStyle = `rgba(255,240,180,${1 - pp.t / 0.8})`;
    ctx.fillText(pp.text, Math.round(pp.x - camX), Math.round(pp.y - pp.t * 20));
  }
}

function drawHud() {
  for (let i = 0; i < player.lives; i++) drawPixels(HEART, 8 + i * 10, 8);
  drawPixels(STRAWBERRY, 8, 20);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`${berryCount} / ${berryTotal}`, 20, 28);
  if (!boss.gone && player.x > BOSS_ROOM.left - 100) {
    ctx.fillStyle = '#0008'; ctx.fillRect(VIEW_W / 2 - 52, 8, 104, 14);
    ctx.fillStyle = '#ddd'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('바위 거인', VIEW_W / 2, 18);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < boss.hp ? '#e24b3b' : '#444';
      ctx.fillRect(VIEW_W / 2 + 22 + i * 8, 12, 6, 6);
    }
  }
  if (messageT > 0) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 40, VIEW_W, 16);
    ctx.fillStyle = '#ffe9a0'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(message, VIEW_W / 2, 51);
  }
}

function drawCredit(y) {
  ctx.fillStyle = '#bbb'; ctx.font = '6px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Pixel Art Bosses by Admurin (https://admurin.itch.io/) - CC-BY 4.0 - https://opengameart.org/content/pixel-art-bosses', VIEW_W / 2, y);
}

function drawPanel(title, lines, color) {
  ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color; ctx.font = 'bold 22px sans-serif';
  ctx.fillText(title, VIEW_W / 2, 90);
  ctx.fillStyle = '#eee'; ctx.font = '10px sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, VIEW_W / 2, 125 + i * 16));
  drawCredit(VIEW_H - 12);
}

function draw() {
  ctx.setTransform(PIXEL, 0, 0, PIXEL, 0, 0);
  ctx.imageSmoothingEnabled = false;   // 픽셀 아트를 흐리지 않게 (최근접 필터)

  if (loadErrors.length) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#f88'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('그림을 못 불러왔어: (assets/images 폴더 확인)', 10, 20);
    loadErrors.forEach((f, i) => ctx.fillText('- ' + f, 10, 36 + i * 12));
    return;
  }

  if (state === 'title') {
    camX = 0;
    drawBackground(); drawSolids();
    drawFrame('skel_idle', time, 100, GROUND_Y - 16);
    drawFrame('boss_idle', time, 300, GROUND_Y - 92);
    drawPanel('딸기 모으기', [
      '← → 움직이기   스페이스 점프 (길게 누르면 높이)',
      '적을 위에서 밟으면 물리칠 수 있어. 불꽃 해골은 밟을 수 없어!',
      '딸기를 모으고, 바위 거인을 3번 밟고, 보물상자를 열어 봐',
      '',
      '스페이스 또는 Enter 로 시작',
    ], '#ff7a7a');
    return;
  }

  drawBackground(); drawSolids(); drawWorld(); drawHud();

  if (state === 'clear') {
    const stars = berryCount === berryTotal ? '★★★' : berryCount >= berryTotal * 0.6 ? '★★☆' : '★☆☆';
    drawPanel('클리어!', [`딸기 ${berryCount} / ${berryTotal}   ${stars}`, '', 'R 또는 Enter 로 다시 하기'], '#ffe066');
  } else if (state === 'over') {
    drawPanel('게임 오버', [`딸기 ${berryCount} / ${berryTotal}`, '', 'R 또는 Enter 로 다시 하기'], '#ff6b6b');
  }
}

// ===== 시작 =====
let last = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000 || 0, 1 / 30);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
preload().then(() => {
  startGame(); state = 'title';
  requestAnimationFrame(loop);
});
</script>
