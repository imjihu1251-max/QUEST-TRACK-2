// 둥근 반투명 판
function panel(x, y, w, h, a) {
  const r = 10;
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  ctx.fillStyle = `rgba(10,8,20,${a})`; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5; ctx.stroke();
}

// 아이템 카드 위치
function cardRect(i) {
  const n = choices.length, cw = 220, ch = 260, gap = 30, x0 = (W - (n * cw + (n - 1) * gap)) / 2;
  return { x: x0 + i * (cw + gap), y: 150, w: cw, h: ch };
}
function wrapText(str, x, y, maxW, size, col) {
  ctx.font = `${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = 'center';
  let line = '', yy = y;
  for (const word of str.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); line = word; yy += size + 6; }
    else line = t;
  }
  ctx.fillText(line, x, yy);
}
function drawPick() {
  ctx.fillStyle = 'rgba(5,4,12,0.7)'; ctx.fillRect(0, 0, W, H);
  text('부속품을 하나 고르세요', W / 2, 80, 40, '#ffd23f');
  text('카드를 클릭하거나 1 · 2 · 3 키', W / 2, 120, 18, '#cbd5e0');
  choices.forEach((it, i) => {
    const c = cardRect(i), on = i === pickHover, lift = on ? -8 : 0;
    panel(c.x, c.y + lift, c.w, c.h, on ? 0.92 : 0.8);
    ctx.strokeStyle = on ? '#ffd23f' : 'rgba(255,210,63,0.35)'; ctx.lineWidth = on ? 3 : 1.5;
    ctx.strokeRect(c.x + 6, c.y + 6 + lift, c.w - 12, c.h - 12);
    glow(c.x + c.w / 2, c.y + 70 + lift, 60, '255,210,90', on ? 0.35 : 0.15);
    ctx.font = `52px "Segoe UI Emoji", "Apple Color Emoji", ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.fillText(it.icon, c.x + c.w / 2, c.y + 72 + lift);
    text(it.name, c.x + c.w / 2, c.y + 140 + lift, 22, '#ffffff');
    wrapText(it.desc, c.x + c.w / 2, c.y + 180 + lift, c.w - 30, 16, '#cbd5e0');
    const have = pk(it.id);
    text(have ? `가진 것 ${have} / ${it.max}` : '새 부속품', c.x + c.w / 2, c.y + c.h - 26 + lift, 14, have ? '#8fd3ff' : '#ffd23f');
    text(`${i + 1}`, c.x + 24, c.y + 26 + lift, 18, '#ffd23f');
  });
}
// 가진 부속품 아이콘 (화면 왼쪽 위, 검기 칸 아래)
function drawPerks() {
  let x = 22;
  for (const it of ITEMS) {
    const n = pk(it.id); if (!n) continue;
    ctx.font = `18px "Segoe UI Emoji", "Apple Color Emoji", ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.fillText(it.icon, x, 88);
    if (n > 1) text(`${n}`, x + 24, 94, 12, '#ffd23f', 'left');
    x += n > 1 ? 36 : 28;
  }
}

function drawHud() {
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H);
    // 제목: 금빛 그라데이션 + 빛
    ctx.save();
    ctx.font = `bold 58px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText('칼 한 자루 보스 사냥', W / 2 + 3, 78 + 4);
    const tg = ctx.createLinearGradient(0, 50, 0, 106);
    tg.addColorStop(0, '#fff6c8'); tg.addColorStop(0.5, '#ffd23f'); tg.addColorStop(1, '#d9741c');
    ctx.shadowColor = 'rgba(255,200,80,0.8)'; ctx.shadowBlur = 24 + Math.sin(clock * 2) * 8;
    ctx.fillStyle = tg; ctx.fillText('칼 한 자루 보스 사냥', W / 2, 78);
    ctx.restore();
    text(`마을에서 출발해 던전 ${FLOORS}층을 돌파하라! (5층마다 보스)`, W / 2, 128, 22, '#ffffff');
    panel(W / 2 - 330, 156, 660, 218, 0.55);
    const lines = [
      'A D (← →)  움직이기     W 또는 Space  점프',
      '마우스 왼쪽 클릭  보고 있는 쪽으로 베기  (Z 도 됨)',
      '공중에서 S(↓) 누른 채 클릭  아래 베기 (맞으면 튀어 오름)',
      'F (마우스 오른쪽)  패링 — 맞기 직전에 누르면 막아냄!',
      '패링하면 불덩이는 보스에게 되돌아가고, 부딪힌 보스는 크게 다침',
      'E  검기 날리기 (3번, 천천히 다시 참) — W 누른 채 쓰면 위로',
      'R (Shift)  돌진 (돌진하는 동안은 안 맞음)',
    ];
    lines.forEach((l, i) => text(l, W / 2, 178 + i * 30, 19, '#e2e8f0'));
    ctx.globalAlpha = 0.55 + Math.abs(Math.sin(clock * 2.5)) * 0.45;
    text('클릭 또는 Enter 로 시작', W / 2, 402, 26, '#ffffff');
    ctx.globalAlpha = 1;
    drawCredits(444);
    return;
  }
  // 하트 (깎인 하트는 빈 칸, 마지막 하나 남으면 두근두근)
  for (let i = 0; i < player.maxHp; i++) {
    const full = i < player.hp, beat = full && player.hp === 1 ? 1 + Math.abs(Math.sin(clock * 6)) * 0.15 : 1;
    const s = 26 * beat, x = 30 + i * 34, y = 18 - (s - 26) / 2;
    heart(x, y - 2, s + 4, 'rgba(0,0,0,0.6)');
    heart(x, y, s, full ? '#ff4d6d' : 'rgba(255,255,255,0.15)');
    if (full) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(x - s * 0.3, y + s * 0.18, 4, 4); }
  }
  // 검기 칸 (차오르는 중인 칸은 아래부터 채워짐)
  for (let i = 0; i < maxAmmo(); i++) {
    const x = 22 + i * 26, y = 56;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 2, y - 2, 20, 14);
    const fill = i < player.ammo ? 1 : (i === player.ammo ? player.ammoT / ammoTime() : 0);
    if (fill > 0) {
      ctx.fillStyle = fill >= 1 ? '#8fd3ff' : 'rgba(143,211,255,0.4)'; ctx.fillRect(x, y + 10 * (1 - fill), 16, 10 * fill);
      if (fill >= 1) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(x, y, 16, 3); }
    }
  }
  drawPerks();
  // 직업 · 수련
  if (job) text(`직업: ${JOBS[job].name}`, 22, 116, 15, `rgb(${JOBS[job].col})`, 'left');
  if (quest) {
    const J = JOBS[quest.job], done = quest.have >= quest.need;
    text(done ? `수련 완료! 마을의 스승에게` : `수련: ${J.qtext} (${quest.have}/${quest.need})`, 22, job ? 136 : 116, 13, done ? '#ffd23f' : '#cbd5e0', 'left');
  }
  // 골드 · 포션
  goldFlash = Math.max(0, goldFlash - 1 / 60);
  panel(W - 170, 52, 156, 30, 0.45);
  drawCoin(W - 154, 67, 8, 0);
  text(`${gold}`, W - 140, 67, goldFlash > 0 ? 19 : 17, goldFlash > 0 ? '#fff3a0' : '#ffd23f', 'left');
  ctx.font = `16px "Segoe UI Emoji", "Apple Color Emoji", ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.fillText('🧪', W - 82, 67);
  text(`${potions} (Q)`, W - 60, 67, 15, potions ? '#ffffff' : '#8a8a9a', 'left');
  // 시간
  panel(W - 92, 14, 78, 32, 0.45);
  text(fmt(runTime), W - 53, 30, 20, '#ffffff');
  // 마을 / 일반 층 안내
  if (inTown()) {
    panel(W / 2 - 170, 12, 340, 52, 0.5);
    text('마을', W / 2, 30, 20, '#ffd23f');
    text(`던전 입구는 오른쪽 끝 → (${floor}층부터)`, W / 2, 52, 15, '#ffffff');
    // 마을 지도 (작은 막대: 상점, 스승들, 입구, 나)
    const mx = W / 2 - 140, my = 74, mw = 280;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(mx, my, mw, 6);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(mx + (SHOP_SPOT.x + 75) / TOWN_W * mw - 2, my - 2, 4, 10);
    for (const n of NPCS) { ctx.fillStyle = n.job ? `rgb(${JOBS[n.job].col})` : '#cbd5e0'; ctx.fillRect(mx + n.x / TOWN_W * mw - 2, my - 1, 4, 8); }
    ctx.fillStyle = '#a07aff'; ctx.fillRect(mx + (GATE.x + 60) / TOWN_W * mw - 3, my - 3, 6, 12);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mx + (player.x + 15) / TOWN_W * mw, my + 3, 5, 0, Math.PI * 2); ctx.fill();
  } else if (!boss && state !== 'title') {
    panel(W / 2 - 150, 12, 300, 52, 0.5);
    const left = spawnLeft + mobs.length, next = Math.ceil(floor / BOSS_EVERY) * BOSS_EVERY;
    text(`던전 ${floor}층`, W / 2, 30, 20, '#ffffff');
    text(door ? '문이 열렸다! 오른쪽으로 →' : `남은 몬스터 ${left}  ·  ${next}층에 보스`, W / 2, 52, 15, door ? '#ffd23f' : '#cbd5e0');
    text('T  마을로 나가기', W / 2, 78, 13, 'rgba(255,255,255,0.6)');
  }
  // 보스 체력: 판, 깎인 만큼 하얀 꼬리가 천천히 따라옴, 화나는 지점 표시
  if (boss) {
    const bw = 460, bx = (W - bw) / 2, by = 50;
    if (boss.hpShow === undefined) boss.hpShow = boss.hp;
    boss.hpShow += (boss.hp - boss.hpShow) * 0.06;
    panel(bx - 14, 10, bw + 28, 62, 0.5);
    text(`${floor}층 보스  ${boss.name}${boss.ph2 ? '  (화났다!)' : ''}`, W / 2, 30, 20, boss.ph2 ? '#ff8a8a' : '#ffffff');
    ctx.fillStyle = '#1a1014'; ctx.fillRect(bx - 2, by - 2, bw + 4, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(bx, by, bw * clamp(boss.hpShow / boss.maxHp, 0, 1), 12);
    const hg = ctx.createLinearGradient(0, by, 0, by + 12);
    if (boss.ph2) { hg.addColorStop(0, '#ff8a7a'); hg.addColorStop(1, '#c0182a'); }
    else { hg.addColorStop(0, '#ffd27a'); hg.addColorStop(1, '#e0702a'); }
    ctx.fillStyle = hg; ctx.fillRect(bx, by, bw * clamp(boss.hp / boss.maxHp, 0, 1), 12);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(bx, by, bw * clamp(boss.hp / boss.maxHp, 0, 1), 3);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx + bw / 2 - 1, by - 2, 2, 16);
  }

  if (state === 'intro') {
    ctx.globalAlpha = clamp(1.6 - stateT, 0, 1);
    text(`${floor}층 보스`, W / 2, H / 2 - 95, 24, '#ffd23f');
    text(boss.name, W / 2, H / 2 - 40, 56, '#ffffff');
    text('등장!', W / 2, H / 2 + 20, 28, '#ffd23f');
    ctx.globalAlpha = 1;
  } else if (state === 'pick') {
    drawPick();
  } else if (state === 'shop') {
    drawShop();
  } else if (state === 'talk') {
    drawTalk();
  } else if (state === 'clear') {
    text('물리쳤다!', W / 2, H / 2 - 90, 56, '#ffd23f');
    if (floor < FLOORS && chest && chest.opened) text('보물상자에서 하트 2개! · 곧 부속품을 고를 수 있어요', W / 2, H / 2 - 36, 22, '#ffffff');
  } else if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    text('쓰러졌다...', W / 2, H / 2 - 50, 52, '#ff6b6b');
    text(`R  ${floor}층 다시 하기 (하트 가득)`, W / 2, H / 2 + 20, 22, '#ffffff');
    text(`Enter  마을로 (골드 절반 잃음, ${section() * BOSS_EVERY + 1}층부터)`, W / 2, H / 2 + 56, 22, '#cbd5e0');
  } else if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    text(`던전 ${FLOORS}층을 모두 돌파했다!`, W / 2, H / 2 - 110, 42, '#ffd23f');
    text(`걸린 시간  ${fmt(runTime)}`, W / 2, H / 2 - 40, 26, '#ffffff');
    text(`쓰러진 횟수  ${falls}번`, W / 2, H / 2, 26, '#ffffff');
    text('Enter  처음 화면으로', W / 2, H / 2 + 50, 22, '#cbd5e0');
    drawCredits(H / 2 + 100);
  }
}

// ===== 돌리기 =====
let last = 0;
function loop(t) {
  const dt = Math.min(1 / 30, (t - last) / 1000 || 0);
  last = t;
  step(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
