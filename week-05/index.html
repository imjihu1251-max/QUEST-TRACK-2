};
const frameAt = (key, t) => {
  const a = ANIM[key], f = Math.floor(t * a.fps);
  return a.loop ? f % a.n : Math.min(a.n - 1, f);
};
const animDone = (key, t) => t * ANIM[key].fps >= ANIM[key].n;
// 한 프레임 그리기. (x, y) 에 기준점이 오도록. 아직 안 불러졌으면 false
function drawFrame(key, f, x, y, scale, flip, filter) {
  const a = ANIM[key], im = a.img;
  if (!im.complete || !im.naturalWidth) return false;
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  if (filter) ctx.filter = filter;
  ctx.drawImage(im, f * a.fw, 0, a.fw, a.fh, -a.ax * scale, -a.ay * scale, a.fw * scale, a.fh * scale);
  ctx.restore();
  return true;
}
const drawAnim = (key, t, x, y, scale, flip, filter) => drawFrame(key, frameAt(key, t), x, y, scale, flip, filter);
const bossFilter = b => b.flash > 0 ? 'brightness(3)' : (b.ph2 ? 'saturate(1.6) brightness(1.15)' : null);
// 그림을 아직 못 불러왔을 때 대신 보여 줄 네모
const box = (o, col) => { ctx.fillStyle = col; ctx.fillRect(o.x, o.y, o.w, o.h); };

// ===== 키보드 =====
const down = new Set(), hit = new Set();
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!down.has(e.code)) hit.add(e.code);
  down.add(e.code);
});
addEventListener('keyup', e => down.delete(e.code));
// 마우스: 왼쪽 버튼 = 베기, 오른쪽 버튼 = 패링
// 마우스 위치는 아이템 카드를 고를 때만 씀 (공격 방향과는 상관없음)
const mouse = { x: -1, y: -1 };
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => {
  e.preventDefault(); setMouse(e);
  const code = 'Mouse' + e.button;
  if (!down.has(code)) hit.add(code);
  down.add(code);
});
addEventListener('mouseup', e => down.delete('Mouse' + e.button));
cv.addEventListener('contextmenu', e => e.preventDefault());   // 오른쪽 클릭 메뉴 안 뜨게
const K = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], down: ['ArrowDown', 'KeyS'],
  jump: ['Space', 'ArrowUp', 'KeyW'], atk: ['Mouse0', 'KeyZ', 'KeyJ'],
  dash: ['KeyR', 'ShiftLeft', 'ShiftRight'], start: ['Enter', 'Space'], retry: ['KeyR'],   // 돌진(대시)은 R. R 다시하기는 쓰러졌을 때만
  parry: ['KeyF', 'Mouse2'], shoot: ['KeyE', 'KeyL'], up: ['KeyW', 'ArrowUp'],
  potion: ['KeyQ'], town: ['KeyT'], shop: ['KeyS', 'ArrowDown'], close: ['Escape'],
};
const held = k => K[k].some(c => down.has(c));
const tap = k => K[k].some(c => hit.has(c));

// ===== 도구 =====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function circleRect(cx, cy, r, b) {
  const nx = clamp(cx, b.x, b.x + b.w), ny = clamp(cy, b.y, b.y + b.h);
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}

// ===== 게임 상태 =====
let state = 'title', stateT = 0, bossIdx = 0, boss = null, player = null;
let shots = [], waves = [], bolts = [], parts = [], mobs = [], fx = [], chest = null;
let shake = 0, runTime = 0, falls = 0, clock = 0, freeze = 0, popups = [];

// ===== 부속품 (아이템) =====
// 보스를 잡으면 3개 중 하나를 고름. 고른 것은 게임이 끝날 때까지 계속 효과가 있음 (같은 것을 또 고르면 더 세짐)
const ITEMS = [
  { id: 'whet',   icon: '🗡️', name: '날카로운 숫돌', desc: '칼 공격력 +50%',            max: 3 },
  { id: 'long',   icon: '📏', name: '긴 칼날',       desc: '칼이 닿는 거리 +30%',       max: 2 },

  { id: 'heart',  icon: '❤️', name: '하트 목걸이',   desc: '최대 하트 +1 (바로 1칸 회복)', max: 3 },
  { id: 'pouch',  icon: '🎒', name: '검기 주머니',   desc: '검기 칸 +1',                max: 2 },
  { id: 'wind',   icon: '🌀', name: '바람 반지',     desc: '검기가 30% 빨리 다시 참',   max: 2 },
  { id: 'flame',  icon: '🔥', name: '불꽃 검기',     desc: '검기 공격력 +1',            max: 2 },
  { id: 'shield', icon: '🛡️', name: '수호의 방패',   desc: '패링할 수 있는 시간이 더 김', max: 2 },
  { id: 'mirror', icon: '🔮', name: '반사 거울',     desc: '패링으로 주는 피해 +1',     max: 2 },
  { id: 'fang',   icon: '🦇', name: '흡혈 송곳니',   desc: '칼로 10번 때릴 때마다 하트 1칸 회복', max: 1 },
  { id: 'wing',   icon: '🕊️', name: '날개 깃털',     desc: '공중에서 한 번 더 점프 (2단 점프)', max: 1 },
  { id: 'cloak',  icon: '🧥', name: '그림자 망토',   desc: '대시를 더 자주 쓸 수 있음',  max: 2 },
];
let perks = {};                                  // 고른 부속품: { id: 고른 횟수 }
let choices = [], pickHover = -1;
const pk = id => perks[id] || 0;
const maxAmmo = () => 3 + pk('pouch') + scroll + (job === 'ranger' ? 2 : 0);
const ammoTime = () => 1.5 * Math.pow(0.7, pk('wind')) * (job === 'ranger' ? 0.6 : 1);
const parryWindow = () => 0.25 + 0.08 * pk('shield') + (job === 'blademaster' ? 0.1 : 0);
const meleeMul = () => (1 + 0.5 * pk('whet')) * weapon().dmg * (job === 'berserker' ? 1.4 : 1);
const bladeDmg = () => 1 + pk('flame') + (job === 'ranger' ? 1 : 0);
function rollChoices() {
  const ok = ITEMS.filter(it => pk(it.id) < it.max);
  for (let i = ok.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ok[i], ok[j]] = [ok[j], ok[i]]; }
  choices = ok.slice(0, 3);
}
function takeItem(it) {
  perks[it.id] = pk(it.id) + 1;
  if (it.id === 'heart') { player.maxHp++; player.hp = Math.min(player.maxHp, player.hp + 1); }
  burst(W / 2, H / 2, '#ffd23f', 40, 400);
  floor++; enterFloor();
}

function newPlayer(hp) {
  return { x: 120, y: GROUND - 62, w: 30, h: 62, vx: 0, vy: 0, face: 1, onGround: true,
    hp, maxHp: 5 + pk('heart') + 2 * armor + (job === 'berserker' ? 1 : 0), inv: 0, hurtT: 0, atk: 0, atkCd: 0, atkDown: false, swingHit: false, dash: 0, dashCd: 0,
    atkT: 9, combo: 0, hitAnimT: 9, parry: 0, parryCd: 0, parryT: 9, parryFlash: 0,
    ammo: maxAmmo(), ammoT: 0, shootCd: 0, hits: 0, airJump: true };
}

function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, life: rand(0.3, 0.7), col, size: rand(2, 5) });
  }
}
// 한 번 재생하고 사라지는 그림 (도깨비불 꺼짐, 슬라임 쓰러짐)
const playFx = (key, x, y, scale, flip = false) => fx.push({ key, x, y, scale, flip, t: 0 });

// ===== 보스 1: 큰 악마 =====
function makeDemon() {
  return {
    name: '큰 악마', maxHp: 18, hp: 18, x: 760, y: GROUND - 100, w: 76, h: 100,
    vx: 0, vy: 0, face: -1, st: 'idle', t: 1.2, flash: 0, ph2: false,
    pal: { sky1: '#2b3a67', sky2: '#e08a5b', hill: '#3b4a5a', ground: '#3b2a1e', top: '#5a8f3c' },
    update(dt) {
      const pc = player.x + player.w / 2, bc = this.x + this.w / 2;
      if (!this.ph2 && this.hp <= this.maxHp / 2) { this.ph2 = true; burst(bc, this.y, '#ff5544', 30, 300); }
      this.t -= dt;
      if (this.st === 'idle') {
        this.vx = 0; this.face = pc < bc ? -1 : 1;
        if (this.t <= 0) {
          if (Math.random() < 0.65) { this.st = 'windup'; this.t = this.ph2 ? 0.4 : 0.6; }
          else { this.st = 'hop'; this.vy = -820; this.vx = clamp((pc - bc) * 1.1, -380, 380); }
        }
      } else if (this.st === 'windup') {
        if (this.t <= 0) { this.st = 'charge'; this.vx = this.face * (this.ph2 ? 640 : 520); }
      } else if (this.st === 'charge') {
        if (this.x <= 0 || this.x + this.w >= W) {
          this.x = clamp(this.x, 0, W - this.w);
          this.st = 'stun'; this.t = 1.3; this.vx = 0; shake = 10;
          burst(this.face > 0 ? W : 0, GROUND - 40, '#c9a46b', 18, 250);
          // 화나면 벽에 부딪힐 때 진흙 덩어리가 떨어짐
          if (this.ph2) for (let i = 0; i < 4; i++) shots.push({ x: rand(60, W - 60), y: rand(-160, -20), vx: 0, vy: 0, r: 16, g: 900, kind: 'mud' });
        }
      } else if (this.st === 'hop') {
        this.vy += GRAV * dt;
        if (this.y + this.h >= GROUND && this.vy > 0) {
          this.y = GROUND - this.h; this.vy = 0; this.vx = 0; this.st = 'idle'; this.t = this.ph2 ? 0.5 : 0.8; shake = 6;
          if (this.ph2) spawnWaves(this.x, this.x + this.w, 360);
        }
      } else if (this.st === 'stun') {
        if (this.t <= 0) { this.st = 'idle'; this.t = 0.5; }
      }
      this.x = clamp(this.x + this.vx * dt, 0, W - this.w);
      this.y += this.vy * dt;
    },
    draw() {
      const jit = this.st === 'windup' ? rand(-3, 3) : 0;
      const key = (this.st === 'charge' || this.st === 'windup' || this.st === 'hop') ? 'demonRun' : 'demonIdle';
      const speed = this.st === 'windup' ? 2 : 1;
      if (!drawAnim(key, clock * speed, this.x + this.w / 2 + jit, this.y + this.h, 3.5, this.face < 0, bossFilter(this)))
        box(this, '#a33');
      if (this.st === 'stun') drawStars(this.x + this.w / 2, this.y - 6);
    },
  };
}

// ===== 보스 2: 불꽃 해골 =====
function makeSkull() {
  return {
    name: '불꽃 해골', maxHp: 22, hp: 22, x: 430, y: 110, w: 80, h: 80,
    st: 'hover', t: 1.6, flash: 0, ph2: false, next: 'bolt', tx: 0, ty: 0, face: -1, slimeT: 3,
    pal: { sky1: '#0e0a1f', sky2: '#3a2a5e', hill: '#211a36', ground: '#2a2433', top: '#6b5b8a' },
    update(dt) {
      const pc = player.x + player.w / 2, bc = this.x + this.w / 2;
      if (!this.ph2 && this.hp <= this.maxHp / 2) { this.ph2 = true; burst(bc, this.y + 30, '#ffb347', 30, 300); }
      if (this.st !== 'dive') this.face = pc < bc ? -1 : 1;
      this.t -= dt;
      // 부하 파란 슬라임이 옆에서 기어 옴
      this.slimeT -= dt;
      if (this.slimeT <= 0 && mobs.length < (this.ph2 ? 3 : 2)) {
        this.slimeT = this.ph2 ? 3 : 5;
        const fromLeft = pc > W / 2;
        mobs.push({ kind: 'slime', x: fromLeft ? -36 : W, y: GROUND - 30, w: 36, h: 30, dir: fromLeft ? 1 : -1, t: 0 });
      }
      if (this.st === 'hover') {
        const tx = clamp(pc - this.w / 2, 0, W - this.w);
        this.x += (tx - this.x) * 1.2 * dt;
        this.y = 110 + Math.sin(clock * 3) * 20;
        if (this.t <= 0) {
          if (this.next === 'bolt') {
            const offs = this.ph2 ? [-340, -170, 0, 170, 340] : [-170, 0, 170];
            offs.forEach(o => bolts.push({ x: clamp(pc + o, 20, W - 20), t: 0.75, on: 0.3 }));
            this.st = 'boltwait'; this.t = 1.2;
          } else {
            this.st = 'aim'; this.t = this.ph2 ? 0.35 : 0.45;
          }
          this.next = Math.random() < 0.5 ? 'bolt' : 'dive';
        }
      } else if (this.st === 'boltwait') {
        this.y = 110 + Math.sin(clock * 3) * 20;
        if (this.t <= 0) { this.st = 'hover'; this.t = this.ph2 ? 1.0 : 1.4; }
      } else if (this.st === 'aim') {
        this.tx = clamp(pc - this.w / 2, 0, W - this.w); this.ty = GROUND - this.h;
        if (this.t <= 0) this.st = 'dive';
      } else if (this.st === 'dive') {
        const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy), sp = (this.ph2 ? 820 : 700) * dt;
        if (d <= sp) { this.x = this.tx; this.y = this.ty; this.st = 'rest'; this.t = this.ph2 ? 0.7 : 1.0; shake = 6; burst(this.x + this.w / 2, GROUND, '#ff9a3c', 14, 200); }
        else { this.x += dx / d * sp; this.y += dy / d * sp; }
      } else if (this.st === 'rest') {
        if (this.t <= 0) this.st = 'rise';
      } else if (this.st === 'rise') {
        this.y -= 300 * dt;
        if (this.y <= 110) { this.y = 110; this.st = 'hover'; this.t = this.ph2 ? 1.0 : 1.4; }
      }
    },
    draw() {
      const jit = this.st === 'aim' ? rand(-4, 4) : 0;
      const speed = this.st === 'aim' || this.st === 'dive' ? 2 : (this.st === 'rest' ? 0.4 : 1);
      // 그림은 왼쪽을 보고 있어서 오른쪽을 볼 때 뒤집음
      if (!drawAnim('skullFly', clock * speed, this.x + this.w / 2 + jit, this.y + this.h / 2, 1.3, this.face > 0, bossFilter(this)))
        box(this, '#e65');
      if (this.st === 'rest') drawStars(this.x + this.w / 2, this.y - 10);
    },
  };
}

// ===== 보스 3: 바위 거인 =====
function makeGolem() {
  return {
    name: '바위 거인', maxHp: 24, hp: 24, x: 720, y: GROUND - 140, w: 130, h: 140,   // 쉽게: 체력 30 → 24
    st: 'walk', t: 1.5, t0: 1, flash: 0, ph2: false, face: -1, at: 0, slammed: false, second: 0, hitT: 0,
    pal: { sky1: '#2a0a0a', sky2: '#a8361c', hill: '#3a1410', ground: '#2b1a14', top: '#e0622b' },
    update(dt) {
      const pc = player.x + player.w / 2, bc = this.x + this.w / 2;
      if (!this.ph2 && this.hp <= this.maxHp / 2) { this.ph2 = true; burst(bc, this.y + 40, '#ffb347', 40, 340); shake = 10; }
      this.t -= dt; this.hitT = Math.max(0, this.hitT - dt);
      if (this.second > 0) { this.second -= dt; if (this.second <= 0) { spawnWaves(this.x, this.x + this.w, 360); shake = 10; } }
      if (this.st === 'walk') {
        this.face = pc < bc ? -1 : 1;
        // 쉽게: 기사 바로 앞(칼 닿는 거리)에서 멈춤. 몸으로 밀고 들어오지 않음
        this.moving = Math.abs(pc - bc) > this.w / 2 + 70;
        if (this.moving) this.x = clamp(this.x + this.face * (this.ph2 ? 70 : 50) * dt, 0, W - this.w);
        if (this.t <= 0) {
          const near = Math.abs(pc - bc) < 220;
          this.st = (near || Math.random() < 0.5) ? 'stomp' : 'throw';
          this.at = 0; this.slammed = false;
          this.t = this.t0 = 0.5;
        }
      } else if (this.st === 'stomp') {
        // 공격 그림 5번째 프레임에서 땅을 내려찍음
        this.at += dt * (this.ph2 ? 1.1 : 0.85);   // 쉽게: 내려찍기 전 준비 동작을 더 느리게
        if (!this.slammed && frameAt('golAtk', this.at) >= 5) {
          this.slammed = true; shake = 14;
          spawnWaves(this.x, this.x + this.w, 340);   // 쉽게: 충격파 430 → 340
          burst(bc + this.face * 50, GROUND, '#c9b8a0', 20, 300);
          if (this.ph2) this.second = 0.8;   // 쉽게: 두 번째 충격파까지 0.4 → 0.8초
        }
        if (frameAt('golAtk', this.at) >= 12) { this.st = 'walk'; this.t = this.ph2 ? 1.3 : 1.8; }
      } else if (this.st === 'throw') {
        if (this.t <= 0) {
          const offs = this.ph2 ? [-150, 0, 150] : [-90, 90];   // 쉽게: 도깨비불 3/5개 → 2/3개
          const sx = bc + this.face * 10, sy = this.y + 10, T = 1.3, g = 900;
          offs.forEach(o => {
            const tx = clamp(pc + o, 10, W - 10), ty = GROUND - 10;
            shots.push({ x: sx, y: sy, vx: (tx - sx) / T, vy: (ty - sy - 0.5 * g * T * T) / T, r: 13, g, kind: 'wisp' });
          });
          this.st = 'recover'; this.t = 1.1;
        }
      } else if (this.st === 'recover') {
        if (this.t <= 0) { this.st = 'walk'; this.t = this.ph2 ? 1.4 : 1.9; }
      }
    },
    onHit() { if (this.st === 'walk' || this.st === 'recover') this.hitT = 0.33; },
    draw() {
      const x = this.x + this.w / 2, y = this.y + this.h, S = 2.4, flip = this.face < 0, fl = bossFilter(this);
      let ok;
      if (this.st === 'stomp') ok = drawAnim('golAtk', this.at, x, y, S, flip, fl);
      else if (this.st === 'throw') ok = drawFrame('golAtk', Math.min(4, Math.floor((1 - this.t / this.t0) * 5)), x, y, S, flip, fl);
      else if (this.hitT > 0) ok = drawAnim('golHit', 0.33 - this.hitT, x, y, S, flip, fl);
      else if (this.st === 'walk' && this.moving) ok = drawAnim('golWalk', clock * (this.ph2 ? 1.5 : 1), x, y, S, flip, fl);
      else ok = drawAnim('golIdle', clock, x, y, S, flip, fl);
      if (!ok) box(this, '#654');
      // 던지기 준비: 손 위에 도깨비불이 커짐
      if (this.st === 'throw') {
        const k = 1 - this.t / this.t0;
        drawAnim('wisp', clock, this.x + this.w / 2 + this.face * 10, this.y + 4, 1 + k);
      }
    },
  };
}

// ===== 보스 4: 지옥 야수 =====
// 불덩이를 연달아 뱉고, 몸을 불기둥으로 바꿔 사라졌다가 기사 발밑에서 불기둥과 함께 나타남
function makeBeast() {
  return {
    name: '지옥 야수', maxHp: 34, hp: 34, x: 740, y: GROUND - 135, w: 90, h: 135,
    st: 'idle', t: 1.2, at: 0, flash: 0, ph2: false, face: -1, hidden: false,
    shotsLeft: 0, shotT: 0, eyeT: 2, next: 'shoot', tx: 0,
    pal: { ground: '#1a0606' },
    update(dt) {
      const pc = player.x + player.w / 2, bc = this.x + this.w / 2;
      if (!this.ph2 && this.hp <= this.maxHp / 2) { this.ph2 = true; burst(bc, this.y + 40, '#ff3b1f', 40, 340); shake = 10; }
      this.t -= dt; this.at += dt;
      // 화나면 빨간 꼬리 눈알을 불러냄
      if (this.ph2 && !this.hidden) {
        this.eyeT -= dt;
        if (this.eyeT <= 0 && mobs.filter(m => m.kind === 'eye').length < 3) {
          this.eyeT = 3.5;
          mobs.push({ kind: 'eye', x: bc - 17, y: this.y - 10, w: 34, h: 30, dir: this.face, t: 0 });
          burst(bc, this.y, '#ff5a6a', 10, 180);
        }
      }
      if (this.st === 'idle') {
        this.face = pc < bc ? -1 : 1;
        if (this.t <= 0) {
          if (this.next === 'shoot') { this.st = 'shoot'; this.at = 0; this.shotsLeft = this.ph2 ? 5 : 3; this.shotT = 0.35; }
          else { this.st = 'crouch'; this.at = 0; this.t = 0.55; }
          this.next = Math.random() < 0.5 ? 'shoot' : 'erupt';
        }
      } else if (this.st === 'shoot') {
        this.shotT -= dt;
        if (this.shotT <= 0 && this.shotsLeft > 0) {
          this.shotsLeft--; this.shotT = 0.3;
          const sx = bc + this.face * 40, sy = this.y + 45;
          const dx = pc - sx, dy = player.y + 25 - sy, d = Math.hypot(dx, dy) || 1, sp = this.ph2 ? 480 : 420;
          shots.push({ x: sx, y: sy, vx: dx / d * sp, vy: dy / d * sp, r: 12, g: 0, kind: 'fire' });
        }
        if (this.shotsLeft === 0 && this.shotT <= 0) { this.st = 'idle'; this.t = this.ph2 ? 0.8 : 1.1; }
      } else if (this.st === 'crouch') {
        if (this.t <= 0) {
          this.st = 'pillar'; this.at = 0; this.t = 0.6; shake = 8;
          bolts.push({ x: bc, t: 0, on: 0.6, hide: true });   // 몸이 불기둥이 됨 (닿으면 다침)
        }
      } else if (this.st === 'pillar') {
        if (this.t <= 0) {
          // 사라진 뒤 기사 발밑에 불기둥 예고 → 그 자리에서 나타남
          this.st = 'gone'; this.hidden = true;
          this.tx = clamp(pc, 60, W - 60);
          bolts.push({ x: this.tx, t: 0.8, on: 0.35 });
          if (this.ph2) [-220, 220].forEach(o => bolts.push({ x: clamp(this.tx + o, 20, W - 20), t: 0.8, on: 0.35 }));
          this.t = 1.15;
        }
      } else if (this.st === 'gone') {
        if (this.t <= 0) {
          this.hidden = false; this.x = clamp(this.tx - this.w / 2, 0, W - this.w);
          this.st = 'idle'; this.t = 0.9; burst(this.x + this.w / 2, GROUND - 20, '#ff8a3c', 24, 300);
        }
      }
    },
    draw() {
      if (this.hidden) return;
      const x = this.x + this.w / 2, y = this.y + this.h, S = 2.3, flip = this.face > 0, fl = bossFilter(this);
      glow(x, this.y + this.h * 0.4, this.st === 'pillar' ? 220 : 120, '255,80,30', this.st === 'pillar' ? 0.6 : 0.3);
      let ok;
      if (this.st === 'shoot') ok = drawAnim('beastShoot', this.at, x, y, S, flip, fl);
      else if (this.st === 'crouch') ok = drawFrame('beastAtk', Math.min(3, Math.floor(this.at / 0.55 * 4)), x, y, S, flip, fl);
      else if (this.st === 'pillar') ok = drawFrame('beastAtk', 4 + (Math.floor(this.at * 14) % 2), x, y, S, flip, fl);
      else ok = drawAnim('beastIdle', clock, x, y, S, flip, fl);
      if (!ok) box(this, '#a22');
    },
  };
}

// ===== 보스 6: 보랏빛 지옥 고양이 =====
// 거리를 재며 어슬렁거리다가 벽까지 돌진(부딪히면 잠깐 어지러움), 덮치기(충격파),
// 유령을 불러 보라 마법 탄을 쏘게 하고, 화나면 쥐 떼를 풀어놓음
function makeCat() {

      this.t -= dt;

      // 화나면 쥐 떼
      if (this.ph2) {
        this.ratT -= dt;

          this.ratT = 4.5;
          for (let i = 0; i < 3; i++) {
            const left = i % 2 === 0;
            mobs.push({ kind: 'rat', x: left ? -40 - i * 50 : W + i * 50, y: GROUND - 26, w: 40, h: 26, dir: left ? 1 : -1, t: 0 });

        // 기사와 180~260 거리를 두고 어슬렁
        this.face = pc < bc ? -1 : 1;
        const d = Math.abs(pc - bc), go = d > 260 ? this.face : d < 180 ? -this.face : 0;
        this.vx = go * (this.ph2 ? 170 : 130);
        this.x = clamp(this.x + this.vx * dt, 0, W - this.w);
        if (this.t <= 0) {
          this.st = Math.random() < 0.55 ? 'windup' : 'crouch';
          this.t = this.st === 'windup' ? (this.ph2 ? 0.35 : 0.5) : 0.35;

        }

          this.boltT -= dt;
          if (this.boltT <= 0) { this.boltT = 0.14; shots.push({ x: bc, y: this.y + 10, vx: -this.vx * 0.12, vy: -520, r: 9, g: 700, kind: 'arcane' }); }

        if (this.x <= 0 || this.x + this.w >= W) {
          this.x = clamp(this.x, 0, W - this.w);

        }
      } else if (this.st === 'skid') {
        if (this.t <= 0) { this.st = 'stalk'; this.t = this.ph2 ? 1.0 : 1.4; }

        if (this.t <= 0) { this.st = 'air'; this.vy = -850; this.vx = clamp((pc - bc) / 0.85, -650, 650); }

        this.vy += GRAV * dt;
        this.x = clamp(this.x + this.vx * dt, 0, W - this.w);
        this.y += this.vy * dt;

          this.y = GROUND - this.h; this.vy = 0; this.vx = 0; shake = 10;
          spawnWaves(this.x, this.x + this.w, this.ph2 ? 420 : 360);
          burst(this.x + this.w / 2, GROUND, '#c78cff', 18, 280);
          this.st = 'stalk'; this.t = this.ph2 ? 1.0 : 1.3;
        }
      }
    },
    draw() {
      const jit = this.st === 'windup' ? rand(-3, 3) : 0;
      const x = this.x + this.w / 2 + jit, y = this.y + this.h, S = 2.6, flip = this.face > 0, fl = bossFilter(this);
      glow(x, this.y + 40, 150, '170,80,255', 0.3);
      let ok;
      if (this.st === 'air') ok = drawFrame('catRun', 3, x, y, S, flip, fl);
      else if (this.st === 'windup' || this.st === 'crouch' || this.st === 'skid') ok = drawFrame('catRun', 2, x, y, S, flip, fl);
      else ok = drawAnim('catRun', clock * (this.st === 'dash' ? 2.2 : Math.abs(this.vx) > 1 ? 1 : 0.4), x, y, S, flip, fl);
      if (!ok) box(this, '#7a3aff');
      if (this.st === 'skid') drawStars(this.x + this.w / 2, this.y - 8);

}

// 나는 잡몹 움직이기. 쏘는 유령은 기사와 거리를 두고 위에 떠 있음
function moveFlyer(s, m, dt) {
  const p = player, pc = p.x + p.w / 2;
  let tx = pc, ty = p.y + 20;
  if (m.shoot) {
    // 기사 옆 240 거리, 점프해서 벨 수 있는 높이. 그쪽이 화면 밖이면 반대쪽으로
    let side = s.x + s.w / 2 < pc ? -1 : 1;
    if (pc + side * 240 < 60 || pc + side * 240 > W - 60) side = -side;
    tx = pc + side * 240; ty = GROUND - 175;
  }
  const dx = tx - (s.x + s.w / 2), dy = ty - (s.y + s.h / 2), d = Math.hypot(dx, dy) || 1;
  const sp = m.shoot && d < 20 ? 0 : m.speed;
  s.x += dx / d * sp * dt + (s.kb || 0) * dt; s.y += dy / d * sp * dt + Math.sin(s.t * 5) * 30 * dt;
  s.dir = pc > s.x + s.w / 2 ? 1 : -1;
  if (m.shoot && s.t > 1.5) s.x = clamp(s.x, 0, W - s.w);    // 쏘는 유령은 화면 안에 머묾
}
// 잡몹이 마법 탄 쏘기 (유령)
function mobShoot(s, dt) {
  const m = MOB[s.kind];
  if (!m.shoot) return;
  s.shootT = (s.shootT ?? 1.5) - dt;
  if (s.shootT > 0) return;
  s.shootT = m.shoot;
  const sx = s.x + s.w / 2, sy = s.y + s.h * 0.45;
  const dx = player.x + player.w / 2 - sx, dy = player.y + 25 - sy, d = Math.hypot(dx, dy) || 1;
  const kind = m.shot || 'arcane', sp = kind === 'laser' ? 340 : 280;
  shots.push({ x: sx, y: sy, vx: dx / d * sp, vy: dy / d * sp, r: kind === 'laser' ? 7 : 9, g: 0, kind });
}
// 보라 마법 탄 그리기
function drawArcane(s) {
  glow(s.x, s.y, 40, '180,100,255', 0.5);
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
  if (!drawAnim('arcane', clock, 0, 0, 2.2, false)) { ctx.fillStyle = '#c78cff'; ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

// ===== 보스 7: 강철 알 요새 =====
// 부채꼴 총알, 바닥을 굴러오는 톱날, 양쪽 벽 포탑(낮은 탄은 점프, 높은 탄은 가만히), 로봇 부르기
// 화나면 반대쪽으로 크게 뛰어 자리를 바꾸고 모든 공격이 빨라짐
const WALL_TURRETS = [                                 // 벽 포탑 4개: 왼쪽/오른쪽, 낮은/높은
  { x: 18, y: GROUND, side: 1, high: false }, { x: 18, y: GROUND - 92, side: 1, high: true },
  { x: W - 18, y: GROUND, side: -1, high: false }, { x: W - 18, y: GROUND - 92, side: -1, high: true },
];
function makeEgg() {
  return {
    name: '강철 알 요새', maxHp: 50, hp: 50, x: 700, y: GROUND - 150, w: 90, h: 150,
    st: 'idle', t: 1.6, at: 0, flash: 0, ph2: false, face: -1, vx: 0, vy: 0, cyc: 0,
    volleys: 0, shotT: 0, sawsLeft: 0, turretOn: 0, turretT: 0, turretI: 0, summonT: 4,
    pal: { ground: '#0c0f14' },
    update(dt) {
      const pc = player.x + player.w / 2, bc = this.x + this.w / 2;
      if (!this.ph2 && this.hp <= this.maxHp / 2) {
        this.ph2 = true; burst(bc, this.y + 40, '#ff6a5a', 40, 340); shake = 10;
        this.st = 'hop'; this.hopTo(); return;
      }
      this.t -= dt; this.at += dt;
      if (this.st !== 'hop') this.face = pc < bc ? -1 : 1;
      // 로봇 부르기
      this.summonT -= dt;
      if (this.summonT <= 0 && mobs.length < (this.ph2 ? 3 : 2)) {
        this.summonT = this.ph2 ? 5 : 7;
        if (Math.random() < 0.5) mobs.push({ kind: 'droid', x: bc - 25, y: this.y - 50, w: 50, h: 44, dir: this.face, t: 0, shootT: 1.5 });
        else { const left = pc > W / 2; mobs.push({ kind: 'tank', x: left ? -60 : W, y: GROUND - 40, w: 60, h: 40, dir: left ? 1 : -1, t: 0, shootT: 2 }); }
        burst(bc, this.y, '#ff6a5a', 12, 200);
      }
      // 벽 포탑: 켜져 있는 동안 번갈아 쏨 (낮은 탄 → 점프, 높은 탄 → 서 있기)
      if (this.turretOn > 0) {
        this.turretOn -= dt; this.turretT -= dt;
        if (this.turretT <= 0) {
          this.turretT = this.ph2 ? 0.45 : 0.62;
          const tu = WALL_TURRETS[(this.turretI++ * 3 + (Math.random() < 0.5 ? 1 : 0)) % 4];
          tu.fireT = 0.3;
          const y = tu.high ? GROUND - 104 : GROUND - 18;
          shots.push({ x: tu.x + tu.side * 24, y, vx: tu.side * (this.ph2 ? 430 : 360), vy: 0, r: 7, g: 0, kind: 'laser' });
        }
      }
      if (this.st === 'idle') {
        if (this.t <= 0) {
          const order = ['barrage', 'saw', 'turrets'];
          const pick = this.ph2 ? order[Math.floor(Math.random() * 3)] : order[this.cyc++ % 3];
          if (pick === 'barrage') { this.st = 'barrage'; this.at = 0; this.volleys = this.ph2 ? 4 : 3; this.shotT = 0.4; }
          else if (pick === 'saw') { this.st = 'saw'; this.sawsLeft = this.ph2 ? 3 : 2; this.shotT = 0.3; }
          else { this.turretOn = this.ph2 ? 4 : 3; this.turretT = 0.3; this.t = 1.0; if (this.ph2 && Math.random() < 0.5) { this.st = 'hop'; this.hopTo(); } }
        }
      } else if (this.st === 'barrage') {
        // 부채꼴 총알
        this.shotT -= dt;
        if (this.shotT <= 0 && this.volleys > 0) {
          this.volleys--; this.shotT = this.ph2 ? 0.42 : 0.55;
          const sx = bc + this.face * 30, sy = this.y + 50, base = Math.atan2(player.y + 30 - sy, pc - sx);
          const n = this.ph2 ? 5 : 3;
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * 0.22, sp = 330;
            shots.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 7, g: 0, kind: 'laser' });
          }
        }
        if (this.volleys === 0 && this.shotT <= 0) { this.st = 'cool'; this.t = 1.3; }   // 열 식히기: 때릴 기회
      } else if (this.st === 'saw') {
        // 바닥을 굴러가는 톱날
        this.shotT -= dt;
        if (this.shotT <= 0 && this.sawsLeft > 0) {
          this.sawsLeft--; this.shotT = 0.65;
          shots.push({ x: bc, y: GROUND - 22, vx: this.face * (this.ph2 ? 440 : 370), vy: 0, r: 20, g: 0, kind: 'saw' });
        }
        if (this.sawsLeft === 0 && this.shotT <= 0) { this.st = 'idle'; this.t = this.ph2 ? 0.8 : 1.2; }
      } else if (this.st === 'cool') {
        if (this.t <= 0) { this.st = 'idle'; this.t = this.ph2 ? 0.6 : 1.0; }
      } else if (this.st === 'hop') {
        this.vy += GRAV * dt;
        this.x = clamp(this.x + this.vx * dt, 0, W - this.w);
        this.y += this.vy * dt;
        if (this.y + this.h >= GROUND && this.vy > 0) {
          this.y = GROUND - this.h; this.vy = 0; this.vx = 0; shake = 14;
          spawnWaves(this.x, this.x + this.w, 400);
          this.st = 'idle'; this.t = 0.9;
        }
      }
    },
    // 기사 반대쪽으로 크게 뛰기
    hopTo() {
      const pc = player.x + player.w / 2, tx = pc < W / 2 ? W - 160 : 70;
      this.vy = -1000; this.vx = (tx - this.x) / 1.0;
    },
    draw() {
      // 벽 포탑
      for (const tu of WALL_TURRETS) {
        if (tu.high) { ctx.fillStyle = '#3a4250'; ctx.fillRect(tu.side > 0 ? 0 : W - 44, tu.y, 44, 8); }
        const on = this.turretOn > 0, f = on && tu.fireT > 0 ? Math.floor((0.3 - tu.fireT) * 20) % 6 : 0;
        if (tu.fireT > 0) tu.fireT -= 1 / 60;
        if (on) glow(tu.x, tu.y - 30, 40, '255,80,60', 0.35);
        drawFrame('wallTurret', f, tu.x, tu.y, 2.4, tu.side > 0);
      }
      const x = this.x + this.w / 2, y = this.y + this.h, S = 3, flip = this.face > 0, fl = bossFilter(this);
      glow(x, this.y + 60, 140, this.ph2 ? '255,80,60' : '255,170,200', 0.25);
      let ok;
      if (this.st === 'barrage') ok = drawAnim('eggShoot', this.at, x, y, S, flip, fl);
      else ok = drawAnim('eggIdle', clock, x, y, S, flip, fl);
      if (!ok) box(this, '#dcc8ec');
      if (this.st === 'cool') {                         // 김이 남
        if (Math.random() < 0.5) parts.push({ x: x + rand(-30, 30), y: this.y + 20, vx: rand(-20, 20), vy: -200, life: 0.5, col: 'rgba(230,230,240,0.7)', size: 5 });
        drawStars(x, this.y - 10);
      }
    },
  };
}
// 빨간 레이저 탄, 굴러오는 톱날 그리기
function drawLaser(s) {
  glow(s.x, s.y, 28, '255,60,60', 0.5);
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
  ctx.fillStyle = '#ff4a4a'; ctx.fillRect(-12, -4, 24, 8);
  ctx.fillStyle = '#ffd0d0'; ctx.fillRect(-8, -2, 16, 4);
  ctx.restore();
}
function drawSaw(s) {
  if (!drawAnim('sawSpin', clock, s.x, s.y, 1.15, s.vx < 0)) { ctx.fillStyle = '#aab'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
  for (let i = 0; i < 2; i++) parts.push({ x: s.x - Math.sign(s.vx) * 18, y: GROUND - 2, vx: -s.vx * 0.2 + rand(-40, 40), vy: rand(-180, -60), life: 0.25, col: '#ffd27a', size: 2 });
}

const MAKERS = [makeDemon, makeSkull, makeGolem, makeBeast, makeBones, makeCat, makeEgg];

function spawnWaves(left, right, speed) {
  waves.push({ x: left, dir: -1, speed }, { x: right, dir: 1, speed });
}

function drawStars(x, y) {
  ctx.fillStyle = '#ffe066';
  for (let i = 0; i < 3; i++) {
    const a = clock * 4 + i * Math.PI * 2 / 3;
    const sx = x + Math.cos(a) * 26, sy = y + Math.sin(a) * 7;
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const r = k % 2 ? 2.5 : 6, b = k * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(sx + Math.cos(b) * r, sy + Math.sin(b) * r);
    }
    ctx.fill();
  }
}

// ===== 흐름: 마을 → 던전 층 → 5층마다 보스 =====
const FLOORS = 35, BOSS_EVERY = 5;
let floor = 1;                 // 지금 던전 몇 층인지
let spawnLeft = 0, spawnT = 0, maxAlive = 3, door = null, fadeIn = 0, swingId = 0;
const section = () => Math.min(6, Math.floor((floor - 1) / BOSS_EVERY));   // 1~5층 숲, 6~10층 동굴 ...
const isBossFloor = () => floor % BOSS_EVERY === 0;

function startGame() {
  runTime = 0; falls = 0; perks = {}; floor = 1; bossIdx = 0;
  gold = 0; potions = 0; armor = 0; scroll = 0; weaponId = 'basic'; owned = { basic: true }; coins = [];
  player = newPlayer(5);
  job = null; quest = null;
  goTown();
}
function goTown(fromDungeon = false) {
  collectAllCoins();
  boss = null; door = null;
  const hp = player ? player.hp : 5;
  player = newPlayer(Math.max(hp, 1));
  player.x = fromDungeon ? GATE.x - 110 : 120; player.face = fromDungeon ? -1 : 1;
  camX = clamp(player.x - W / 2, 0, TOWN_W - W);
  shots = []; waves = []; bolts = []; parts = []; mobs = []; fx = []; blades = []; chest = null;
  state = 'town'; stateT = 0; fadeIn = 1;
}
// 지금 층(floor)에 들어가기
function enterFloor() {
  collectAllCoins();
  const hp = player ? player.hp : 5;
  player = newPlayer(hp);
  player.x = 60;
  shots = []; waves = []; bolts = []; parts = []; mobs = []; fx = []; blades = []; chest = null; door = null;
  fadeIn = 1;
  if (isBossFloor()) {
    bossIdx = section();
    boss = MAKERS[bossIdx]();
    state = 'intro'; stateT = 0;
  } else {
    boss = null;
    const k = floor - section() * BOSS_EVERY;        // 구역 안에서 몇 번째 층인지 (1~4)
    spawnLeft = 4 + section() + k;                   // 이 층에서 나올 잡몹 수
    maxAlive = 2 + Math.min(3, section() + Math.ceil(k / 2));
    spawnT = 1.2;
    state = 'floor'; stateT = 0;
  }
}
const startBoss = enterFloor;   // 예전 이름 (R 다시하기 등)

// 구역마다 나오는 잡몹
const FLOOR_MOBS = [
  ['slime', 'pebble', 'mudw'],           // 1~4층  숲
  ['slime', 'eye', 'pebble', 'skel'],    // 6~9층  동굴
  ['wispm', 'mudw', 'demon'],            // 11~14층 화산
  ['demon', 'eye', 'wispm'],             // 16~19층 불지옥
  ['skel', 'pebble', 'eye', 'demon'],    // 21~24층 묘지
  ['rat', 'ghost', 'rat', 'demon'],      // 26~29층 보라 마법의 성
  ['droid', 'tank', 'saw', 'droid'],     // 31~34층 기계 공장
];
function spawnMob() {
  const pool = FLOOR_MOBS[section()], kind = pool[Math.floor(Math.random() * pool.length)], m = MOB[kind];
  const fromLeft = Math.random() < 0.35 && player.x > 260;   // 대부분 오른쪽에서 나옴
  const hp = m.hp + Math.floor(section() / 2);
  const s = { kind, w: m.w, h: m.h, dir: fromLeft ? 1 : -1, t: 0, hp, maxHp: hp, chase: true, flash: 0, kb: 0, lastSwing: -1 };
  s.x = fromLeft ? -s.w : W;
  s.y = m.fly ? rand(140, 300) : GROUND - s.h;
  mobs.push(s);
}
// 잡몹에게 피해. 쓰러지면 true
function hitMob(s, dmg, fromX, src) {
  s.hp = (s.hp ?? 1) - dmg; s.flash = 0.12;
  s.kb = (s.x + s.w / 2 < fromX ? -1 : 1) * 260;
  burst(s.x + s.w / 2, s.y + s.h / 2, '#ffffff', 6, 200);
  if (s.hp > 0) return false;
  killMob(s);
  questEvent('kill'); if (src === 'blade') questEvent('blade');
  dropCoins(s.x + s.w / 2, s.y + s.h / 2, 2 + section() * 2 + (Math.random() < 0.3 ? 2 : 0));
  return true;
}

// 일반 층: 잡몹을 다 잡으면 오른쪽 문이 열림
function floorFight(dt) {
  const p = player;
  updPlayer(dt);
  // 잡몹 나오기
  spawnT -= dt;
  if (spawnLeft > 0 && spawnT <= 0 && mobs.length < maxAlive) { spawnMob(); spawnLeft--; spawnT = rand(0.5, 1.1); }

  // 칼: 한 번 휘두를 때 닿은 잡몹 모두 1번씩
  if (p.atk > 0) {
    const ab = atkBox(p);
    mobs = mobs.filter(s => {
      if (s.lastSwing === swingId || !overlap(ab, s)) return true;
      s.lastSwing = swingId;
      if (p.atkDown) { p.vy = -560; }
      if (pk('fang') && ++p.hits % 10 === 0 && p.hp < p.maxHp) { p.hp++; popups.push({ str: '+1 ❤', x: p.x + p.w / 2, y: p.y - 20, t: 0 }); }
      return !hitMob(s, meleeMul(), p.x + p.w / 2);
    });
  }
  // 검기
  blades = blades.filter(b => {
    b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    const hb = { x: b.x - 14, y: b.y - 18, w: 28, h: 36 };
    for (const s of mobs) if (overlap(hb, s)) {
      if (hitMob(s, bladeDmg(), b.x, 'blade')) mobs = mobs.filter(o => o !== s);
      return false;
    }
    return b.x > -40 && b.x < W + 40 && b.y > -40;
  });
  // 잡몹 움직이기 + 부딪히기
  mobs = mobs.filter(s => {
    const m = MOB[s.kind];
    s.t += dt; s.flash = Math.max(0, s.flash - dt);
    const dx = p.x + p.w / 2 - (s.x + s.w / 2);
    if (m.fly) { moveFlyer(s, m, dt); mobShoot(s, dt); }
    else {
      s.dir = Math.abs(dx) > 6 ? Math.sign(dx) : s.dir;
      s.x += (s.dir * m.speed + s.kb) * dt;
      mobShoot(s, dt);
    }
    s.kb *= Math.pow(0.02, dt);
    s.x = clamp(s.x, -s.w, W);
    if (overlap(p, s)) {
      const r = hurtPlayer(s.x + s.w / 2);
      if (r === 'parry' && hitMob(s, 2 + pk('mirror'), p.x + p.w / 2)) return false;
    }
    return true;
  });
  // 날아오는 마법 탄
  const ab = p.atk > 0 ? atkBox(p) : null;
  shots = shots.filter(s => {
    s.vy += s.g * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (ab && circleRect(s.x, s.y, s.r, ab)) { killShot(s); return false; }
    if (circleRect(s.x, s.y, s.r, p)) { hurtPlayer(s.x); killShot(s); return false; }
    if (s.y + s.r >= GROUND && s.vy > 0) { killShot(s); return false; }
    return s.x > -60 && s.x < W + 60 && s.y > -100;
  });
  // 다 잡으면 문이 열림 + 하트 1칸
  if (!door && spawnLeft === 0 && mobs.length === 0) {
    shots = [];
    door = { t: 0 };
    if (p.hp < p.maxHp) { p.hp++; popups.push({ str: '+1 ❤', x: p.x + p.w / 2, y: p.y - 20, t: 0 }); }
    burst(DOOR.x + DOOR.w / 2, GROUND - 60, '#ffd23f', 30, 300);
  }
  if (door) {
    door.t += dt;
    if (door.t > 0.6 && overlap(p, DOOR)) { floor++; enterFloor(); }
  }
}
const DOOR = { x: W - 96, y: GROUND - 120, w: 70, h: 120 };
const GATE = { x: 2880 - 140,   // 마을 넓이(TOWN_W) 오른쪽 끝
  y: GROUND - 150, w: 120, h: 150 };   // 마을의 던전 입구

// 문 그리기 (돌 아치. 닫혀 있으면 쇠창살)
function drawDoor() {
  const d = DOOR, open = !!door, cx = d.x + d.w / 2;
  ctx.fillStyle = '#2b2a33'; ctx.fillRect(d.x - 12, d.y - 10, d.w + 24, d.h + 10);
  ctx.fillStyle = '#3d3b48';
  for (let y = d.y - 10; y < GROUND; y += 16) for (let x = d.x - 12 + ((y / 16) % 2) * 8; x < d.x + d.w + 12; x += 16) ctx.fillRect(x, y, 14, 14);
  ctx.fillStyle = open ? '#1a0f08' : '#06060a';
  ctx.beginPath(); ctx.moveTo(d.x, GROUND); ctx.lineTo(d.x, d.y + 30); ctx.arc(cx, d.y + 30, d.w / 2, Math.PI, 0); ctx.lineTo(d.x + d.w, GROUND); ctx.fill();
  if (open) {
    glow(cx, GROUND - 50, 90, '255,200,90', 0.45 + Math.sin(clock * 4) * 0.1);
    text('다음 층 →', cx - 10, d.y - 30, 18, '#ffd23f');
  } else {
    const drop = 0;
    ctx.fillStyle = '#6b6f7a';

function wrapLeft(str, x, y, maxW, size, col) {
  ctx.font = `${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

  const wpn = WEAPONS[it.id], p = player;
  if (wpn && owned[it.id]) { weaponId = it.id; say(`${wpn.name} 장착!`); return; }

    ctx.font = `24px "Segoe UI Emoji", "Apple Color Emoji", ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.fillText(it.icon, r.x + 54, r.y + r.h / 2 + 1);
    text(it.name, r.x + 80, r.y + r.h / 2, 17, '#ffffff', 'left');
    ctx.font = `13px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = '#cbd5e0'; ctx.fillText(it.desc, r.x + 210, r.y + r.h / 2);
    const [tag, col] = shopTag(it);
    text(tag, r.x + r.w - 16, r.y + r.h / 2, 15, col, 'right');
  });
  text('숫자 키 또는 클릭으로 사기 · 무기는 하나만 들 수 있어요 (산 무기는 언제든 다시 장착)', W / 2, 508, 13, '#cbd5e0');
  if (shopMsgT > 0) { ctx.globalAlpha = clamp(shopMsgT * 2, 0, 1); text(shopMsg, W / 2, 478, 18, '#9aff9a'); ctx.globalAlpha = 1; }
}

// 마을 그리기 위의 움직이는 것들: 횃불, 말하는 슬라임, 안내판
function drawTownLive() {
  for (const tx of [GATE.x - 8, GATE.x + GATE.w + 8]) {
    const fy = GATE.y + 30;
    glow(tx, fy, 70, '255,160,60', 0.4 + Math.sin(clock * 9 + tx) * 0.08);
    ctx.fillStyle = '#ff8a2b'; ctx.beginPath(); ctx.ellipse(tx, fy - 6, 6, 10 + Math.sin(clock * 14 + tx) * 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.ellipse(tx, fy - 4, 3, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2a1e'; ctx.fillRect(tx - 3, fy + 4, 6, 18);
  }
  // 마을 슬라임
  drawAnim('slimeWave', clock, 760, GROUND, 3, false);
  if (Math.abs(player.x - 760) < 120) {
    panel(670, GROUND - 110, 190, 40, 0.75);
    text('던전 조심해! 5층마다 보스야', 765, GROUND - 90, 14, '#ffffff');
  }
  drawAnim('pebbleIdle', clock, 830, GROUND, 3, true);
  // 안내판
  for (const sx of [180, GATE.x - 160]) {
    ctx.fillStyle = '#6b4a2e'; ctx.fillRect(sx + 40, GROUND - 60, 6, 60);
    ctx.fillStyle = '#8b6440'; ctx.fillRect(sx, GROUND - 76, 90, 30);
    text(sx < 500 ? '던전 →→' : '던전 →', sx + 45, GROUND - 61, 16, '#fff3d6');
  }
  text(`던전 ${FLOORS}층`, GATE.x + GATE.w / 2, GATE.y - 18, 18, '#ffd23f');
}


// ===== 주인공 =====
function atkBox(p) {
  if (p.atkDown) return { x: p.x - 14, y: p.y + p.h - 4, w: p.w + 28, h: 46 };
  const reach = 64 * (1 + 0.3 * pk('long')) * weapon().reach;   // 긴 칼날 + 무기
  return p.face > 0 ? { x: p.x + p.w - 4, y: p.y - 8, w: reach, h: 56 } : { x: p.x + 4 - reach, y: p.y - 8, w: reach, h: 56 };
}

function updPlayer(dt) {
  const p = player;
  p.inv = Math.max(0, p.inv - dt); p.atkCd -= dt; p.dashCd -= dt;
  if (p.dash > 0) {
    p.dash -= dt; p.vx = p.face * 720; p.vy = 0;
    if (Math.random() < 0.6) parts.push({ x: p.x + p.w / 2, y: p.y + rand(5, p.h), vx: -p.face * 80, vy: 0, life: 0.25, col: '#a6c8ff', size: 3 });
  } else {
    const mv = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
    if (p.hurtT > 0) p.hurtT -= dt;
    else { p.vx = mv * 300 * (1 + 0.15 * pk('boots')); if (mv) p.face = mv; }   // 가벼운 장화
    if (p.onGround) p.airJump = true;
    if (tap('jump') && p.onGround) { p.vy = -760; p.onGround = false; }
    else if (tap('jump') && pk('wing') && p.airJump) {      // 날개 깃털: 2단 점프
      p.airJump = false; p.vy = -700; burst(p.x + p.w / 2, p.y + p.h, '#ffffff', 10, 160);
    }
    if (!held('jump') && p.vy < -280) p.vy = -280;
    if (tap('dash') && p.dashCd <= 0) {
      if (mv) p.face = mv;
      p.dash = 0.16; p.dashCd = 0.55 * Math.pow(0.65, pk('cloak')) * (job === 'blademaster' ? 0.6 : 1);   // 그림자 망토
    }
    p.vy += GRAV * dt;
  }
  // 회복 포션 (Q)
  if (tap('potion') && potions > 0 && p.hp < p.maxHp && state !== 'dead') {
    potions--; p.hp = Math.min(p.maxHp, p.hp + 2);
    burst(p.x + p.w / 2, p.y + 20, '#ff5a6a', 18, 220); ring(p.x + p.w / 2, p.y + p.h / 2, '#ff8a9a', 50);
    popups.push({ str: '+2 ❤', x: p.x + p.w / 2, y: p.y - 20, t: 0 });
  }
  // 클릭(또는 Z)하면 지금 보고 있는 쪽으로 벰. 공중에서 S(↓)를 누르고 있으면 아래 베기
  if (tap('atk') && p.atkCd <= 0) {
    p.atk = 0.16; p.atkCd = atkCdNow(); p.atkDown = !p.onGround && held('down'); p.swingHit = false; swingId++;
    p.atkT = 0; p.combo = 1 - p.combo;   // 공격 그림 두 가지를 번갈아
  }
  if (tap('parry') && p.parryCd <= 0) {
    p.parry = parryWindow(); p.parryCd = PARRY_CD; p.parryT = 0;
  }
  p.parry = Math.max(0, p.parry - dt); p.parryCd -= dt; p.parryT += dt;
  // 검기 날리기: 3번까지, 1.5초마다 하나씩 다시 참. W(↑)를 누른 채 쓰면 비스듬히 위로
  p.shootCd -= dt;
  if (p.ammo < maxAmmo()) { p.ammoT += dt; if (p.ammoT >= ammoTime()) { p.ammo++; p.ammoT = 0; } }
  if (tap('shoot') && p.ammo > 0 && p.shootCd <= 0 && state !== 'dead') {
    p.ammo--; p.shootCd = 0.25;
    p.atkT = 0; p.combo = 0; p.atkDown = false;       // 두 번째 공격 그림으로 휘두름
    const up = held('up'), sp = 820;
    blades.push({ x: p.x + p.w / 2 + p.face * 20, y: p.y + p.h * 0.4, vx: p.face * sp * (up ? 0.72 : 1), vy: up ? -sp * 0.7 : 0, t: 0 });
  }
  p.parryFlash = Math.max(0, p.parryFlash - dt);
  if (p.atk > 0) p.atk -= dt;
  p.atkT += dt; p.hitAnimT += dt;
  p.x = clamp(p.x + p.vx * dt, 0, worldW() - p.w);
  p.y += p.vy * dt;
  if (p.y + p.h >= GROUND) { p.y = GROUND - p.h; p.vy = 0; p.onGround = true; } else p.onGround = false;
}

// 맞을 뻔했을 때 부름. 패링에 성공하면 'parry' 를 돌려줌
function hurtPlayer(fromX) {
  const p = player;
  if (state !== 'fight' && state !== 'floor') return;
  if (p.parry > 0) { parrySuccess(fromX); return 'parry'; }
  if (p.inv > 0 || p.dash > 0) return;
  p.hp--; p.inv = 1.0; p.hurtT = 0.25; p.hitAnimT = 0;
  const d = (p.x + p.w / 2) < fromX ? -1 : 1;
  p.vx = d * 360; p.vy = -380; shake = 8;
  burst(p.x + p.w / 2, p.y + 20, '#ff4d4d', 14, 220);
  ring(p.x + p.w / 2, p.y + p.h / 2, '#ff6b6b', 40);
  if (p.hp <= 0) { state = 'dead'; stateT = 0; falls++; }
}

// ===== 패링 =====
// F (또는 마우스 오른쪽) 를 누르고 0.25초 안에 공격을 받으면 막아냄
const PARRY_CD = 0.7;   // 패링 시간은 parryWindow() (수호의 방패로 늘어남)
function parrySuccess(fromX) {
  const p = player;
  p.parry = 0; p.parryCd = 0;          // 성공하면 바로 또 패링할 수 있음
  questEvent('parry');
  p.inv = Math.max(p.inv, 0.4);        // 잠깐 안 맞음
  p.parryFlash = 0.3;
  freeze = 0.12;                       // 아주 잠깐 멈춤 (손맛)
  shake = Math.max(shake, 6);
  const px = p.x + p.w / 2, py = p.y + p.h / 2;
  burst(px + (fromX < px ? -16 : 16), py, '#9fe8ff', 18, 320);
  burst(px + (fromX < px ? -16 : 16), py, '#ffffff', 10, 260);
  popups.push({ str: '패링!', x: px, y: p.y - 20, t: 0 });
}

// 보스에게 피해. 쓰러지면 true
function damageBoss(n, x, y) {
  boss.hp -= n; boss.flash = 0.1; shake = Math.max(shake, 3);
  if (boss.onHit) boss.onHit();
  burst(x, y, '#ffffff', 10, 260);
  ring(x, y, '#ffffff', n > 1 ? 80 : 45);
  if (boss.hp > 0) return false;
  const bc = boss.x + boss.w / 2;
  state = 'clear'; stateT = 0; shake = 16;
  burst(bc, boss.y + boss.h / 2, '#ffd23f', 60, 450);
  shots = []; waves = []; bolts = []; blades = [];
  mobs.forEach(killMob);
  mobs = [];
  chest = { x: W / 2, t: 0, opened: false };
  dropCoins(bc, boss.y + boss.h / 2, 40 + 40 * section());          // 보스는 금화를 잔뜩
  return true;
}

// ===== 한 프레임 계산 =====
function step(dt) {
  clock += dt; stateT += dt;
  shake = Math.max(0, shake - 40 * dt);

  fadeIn = Math.max(0, fadeIn - dt * 2.5);
  if (state === 'title') { if (tap('start') || hit.has('Mouse0')) startGame(); }
  else if (state === 'talk') { updNPCs(dt); updTalk(); }
  else if (state === 'town') {
    updNPCs(dt);
    camX += (clamp(player.x + player.w / 2 - W / 2, 0, TOWN_W - W) - camX) * Math.min(1, dt * 8);
    if (npcNear() && player.onGround && tap('shop')) talkTo(npcNear());
    else if (nearShop() && player.onGround && tap('shop')) { state = 'shop'; stateT = 0; shopMsgT = 0; }
    else {
      updPlayer(dt);
      blades = blades.filter(b => { b.x += b.vx * dt; b.y += b.vy * dt; return b.x > camX - 40 && b.x < camX + W + 40 && b.y > -40; });
      // 던전 입구 안쪽까지 걸어가면 지난번에 나온 층부터
      if (player.x + player.w / 2 > GATE.x + 30) enterFloor();
    }
  }
  else if (state === 'shop') {
    shopMsgT = Math.max(0, shopMsgT - dt);
    shopHover = SHOP.findIndex((it, i) => overlap({ x: mouse.x, y: mouse.y, w: 1, h: 1 }, shopRow(i)));
    const k = SHOP.findIndex((it, i) => hit.has('Digit' + (i + 1)));
    if (k >= 0) buy(SHOP[k]);
    else if (hit.has('Mouse0') && shopHover >= 0) buy(SHOP[shopHover]);
    if (tap('close') || (stateT > 0.2 && tap('shop')) || (hit.has('Mouse0') && overlap({ x: mouse.x, y: mouse.y, w: 1, h: 1 }, SHOP_CLOSE))) { state = 'town'; stateT = 0; }
  }
  else if (state === 'floor') {
    runTime += dt;
    if (tap('town')) { goTown(true); }                   // T: 던전에서 나와 마을로 (이 층은 다음에 처음부터)
    else if (freeze > 0) freeze -= dt;
    else { floorFight(dt); updCoins(dt, !!door); }
  }
  else if (state === 'intro') { updPlayer(dt); if (stateT > 1.6) { state = 'fight'; stateT = 0; } }
  else if (state === 'fight') {
    runTime += dt;
    if (freeze > 0) freeze -= dt;    // 패링 순간 잠깐 멈춤
    else { fight(dt); updCoins(dt, false); }
  }
  else if (state === 'clear') {
    updPlayer(dt); updCoins(dt, stateT > 0.8);
    // 보물상자가 열리면 하트 회복
    if (chest) {
      chest.t += dt;
      if (!chest.opened && chest.t > 0.9) {
        chest.opened = true;
        if (floor < FLOORS) player.hp = Math.min(player.maxHp, player.hp + 2);
        burst(chest.x, GROUND - 30, '#ff4d6d', 16, 260); burst(chest.x, GROUND - 30, '#ffd23f', 16, 260);
      }
    }
    if (stateT > 2.6) {
      if (floor >= FLOORS) { state = 'win'; stateT = 0; }
      else {
        rollChoices();
        if (choices.length) { state = 'pick'; stateT = 0; }
        else { floor++; enterFloor(); }               // 고를 부속품이 하나도 안 남았으면 바로 다음 층
      }
    }
  }
  else if (state === 'pick') {
    // 1 2 3 키 또는 카드 클릭으로 고르기
    pickHover = -1;
    choices.forEach((it, i) => { const c = cardRect(i); if (overlap({ x: mouse.x, y: mouse.y, w: 1, h: 1 }, c)) pickHover = i; });
    const keys = ['Digit1', 'Digit2', 'Digit3'];
    let pick = keys.findIndex((k, i) => i < choices.length && hit.has(k));
    if (pick < 0 && stateT > 0.4 && hit.has('Mouse0') && pickHover >= 0) pick = pickHover;
    if (pick >= 0) takeItem(choices[pick]);
  }
  else if (state === 'dead') {
    if (tap('retry')) { player.hp = player.maxHp; enterFloor(); }               // 이 층 다시
    else if (stateT > 0.5 && tap('start')) {          // 마을로: 골드 절반 잃고, 이 구역 첫 층부터
      gold = Math.floor(gold / 2); coins = [];
      floor = section() * BOSS_EVERY + 1; player.hp = player.maxHp; goTown(true);
    }
  }
  else if (state === 'win') { if (stateT > 1 && tap('start')) { state = 'title'; stateT = 0; } }

  for (const q of parts) { q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  updAmb(dt);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < 0.3);
  for (const q of popups) q.t += dt;
  popups = popups.filter(q => q.t < 0.7);
  for (const e of fx) e.t += dt;
  fx = fx.filter(e => !animDone(e.key, e.t));
  hit.clear();
}

function fight(dt) {
  const p = player;
  updPlayer(dt);
  boss.flash = Math.max(0, boss.flash - dt);
  boss.update(dt);
  const bc = boss.x + boss.w / 2;

  // 칼에 맞았나
  if (p.atk > 0) {
    const ab = atkBox(p);
    if (!p.swingHit && !boss.hidden && overlap(ab, boss)) {
      p.swingHit = true;
      if (p.atkDown) { p.vy = -640; p.atk = 0; }
      // 흡혈 송곳니: 10번 때릴 때마다 하트 1칸
      if (pk('fang') && ++p.hits % 10 === 0 && p.hp < p.maxHp) { p.hp++; burst(p.x + p.w / 2, p.y, '#ff4d6d', 12, 200); popups.push({ str: '+1 ❤', x: p.x + p.w / 2, y: p.y - 20, t: 0 }); }
      if (damageBoss(meleeMul(), clamp(ab.x + ab.w / 2, boss.x, boss.x + boss.w), clamp(ab.y + ab.h / 2, boss.y, boss.y + boss.h))) return;
    }
    // 날아오는 것도 벨 수 있음
    shots = shots.filter(s => {
      if (!s.back && circleRect(s.x, s.y, s.r, ab)) { killShot(s); return false; }
      return true;
    });
    // 부하는 한 번 베면 쓰러짐
    mobs = mobs.filter(s => {
      if (overlap(ab, s)) { killMob(s); return false; }
      return true;
    });
  }

  // 검기: 보스에게 1, 슬라임은 쓰러뜨리고, 날아오는 불덩이·진흙과 부딪히면 둘 다 사라짐
  blades = blades.filter(b => {
    b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    const hb = { x: b.x - 14, y: b.y - 18, w: 28, h: 36 };
    if (!boss.hidden && overlap(hb, boss)) { damageBoss(bladeDmg(), b.x, b.y); return false; }
    for (const s of mobs) if (overlap(hb, s)) {
      killMob(s); mobs = mobs.filter(o => o !== s); return false;
    }
    for (const s of shots) if (!s.back && circleRect(s.x, s.y, s.r, hb)) { killShot(s); shots = shots.filter(o => o !== s); burst(b.x, b.y, '#bfe9ff', 8, 200); return false; }
    return b.x > -40 && b.x < W + 40 && b.y > -40;
  });
  if (state !== 'fight') { blades = []; return; }

  // 보스 몸에 부딪힘 (패링하면 보스가 2만큼 다치고 나는 뒤로 밀려남)
  if (!boss.hidden && overlap(p, boss) && hurtPlayer(bc) === 'parry') {
    const d = (p.x + p.w / 2) < bc ? -1 : 1;
    p.vx = d * 420; p.vy = -300; p.hurtT = 0.2;
    if (damageBoss(2 + pk('mirror'), clamp(p.x + p.w / 2, boss.x, boss.x + boss.w), p.y + p.h / 2)) return;
  }

  // 부하 몬스터 (패링하면 쓰러짐)
  mobs = mobs.filter(s => {
    s.t += dt;
    if (MOB[s.kind].fly) { moveFlyer(s, MOB[s.kind], dt); mobShoot(s, dt); }   // 눈알·유령·로봇: 날아다님
    else if (s.kind === 'tank') { const dx = p.x + p.w / 2 - (s.x + s.w / 2); s.dir = Math.sign(dx) || s.dir; if (Math.abs(dx) > 150) s.x += s.dir * 45 * dt; mobShoot(s, dt); }
    else { s.x += s.dir * MOB[s.kind].speed * dt; mobShoot(s, dt); }
    if (overlap(p, s) && hurtPlayer(s.x + s.w / 2) === 'parry') { killMob(s); return false; }
    return s.x > -60 && s.x < W + 60;
  });

  // 날아오는 것 (패링하면 보스에게 되돌아감)
  shots = shots.filter(s => {
    s.vy += s.g * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.back) {
      if (!boss.hidden && circleRect(s.x, s.y, s.r, boss)) { killShot(s); damageBoss(1 + pk('mirror'), s.x, s.y); return false; }
      return s.x > -50 && s.x < W + 50 && s.y > -80 && s.y < H;
    }
    if (circleRect(s.x, s.y, s.r, p)) {
      if (hurtPlayer(s.x) === 'parry') {
        const dx = boss.x + boss.w / 2 - s.x, dy = boss.y + boss.h / 2 - s.y, d = Math.hypot(dx, dy) || 1;
        s.vx = dx / d * 700; s.vy = dy / d * 700; s.g = 0; s.back = true;
        return true;
      }
      killShot(s); return false;
    }
    if (s.y + s.r >= GROUND && s.vy > 0) { s.y = GROUND - s.r; killShot(s); return false; }
    return s.x > -60 && s.x < W + 60;
  });
  if (state !== 'fight') { shots = []; return; }   // 되돌린 불로 보스를 쓰러뜨렸을 때

  // 땅을 타고 오는 충격파 (패링하면 부서짐)
  waves = waves.filter(w => {
    w.x += w.dir * w.speed * dt;
    if (overlap(p, { x: w.x - 14, y: GROUND - 34, w: 28, h: 34 }) && hurtPlayer(w.x) === 'parry') return false;
    return w.x > -40 && w.x < W + 40;
  });

  // 불기둥
  bolts = bolts.filter(b => {
    b.t -= dt;
    if (b.t <= 0) {
      if (!b.struck) { b.struck = true; shake = Math.max(shake, 5); burst(b.x, GROUND - 4, '#ffb347', 10, 220); }
      if (overlap(p, { x: b.x - 18, y: 0, w: 36, h: GROUND })) hurtPlayer(b.x);
    }
    return b.t > -b.on;
  });
}

// 부하 몬스터 종류: 그림, 크기, 빠르기, 쓰러질 때 그림
const MOB = {
  slime:  { walk: 'slimeWalk', die: 'slimeDie',  scale: 3,   speed: 90,  col: '#7fd4ff', hp: 2, w: 36, h: 30 },
  pebble: { walk: 'pebbleRun', die: 'pebbleDie', scale: 4,   speed: 170, col: '#9aa7c7', hp: 1, w: 30, h: 30 },
  eye:    { walk: 'eyeFly',    die: null,        scale: 2.5, speed: 120, col: '#ff5a6a', hp: 2, w: 34, h: 30, facesLeft: true, fly: true },
  // 던전 층에만 나오는 잡몹
  mudw:   { walk: 'mudWalk',   die: null,        scale: 2.8, speed: 70,  col: '#8a6a4a', hp: 3, w: 40, h: 36 },

function killShot(s) {

// ===== 배경 그림 =====
// 배경은 판마다 한 번만 그려 두고(오프스크린 캔버스) 매 프레임 그대로 붙여서 빠름
function rng(seed) { let s = seed; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function layer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
function vgrad(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr; }
function softGlow(g, x, y, r, rgb, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
// 울퉁불퉁한 산 능선
function ridge(g, base, amp, freq, off, col, gw = W) {
  g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= gw; x += 6)
    g.lineTo(x, base - (Math.sin(x * freq + off) * 0.6 + Math.sin(x * freq * 2.3 + off * 1.7) * 0.3 + Math.sin(x * freq * 5.1 + off * 0.3) * 0.1) * amp);
  g.lineTo(gw, H); g.fill();
}
function pine(g, x, base, h, col) {
  g.fillStyle = col; g.fillRect(x - 2, base - h * 0.25, 4, h * 0.25);
  for (let k = 0; k < 4; k++) {
    const w = h * 0.3 * (1 - k * 0.18), y = base - h * 0.15 - k * h * 0.2;
    g.beginPath(); g.moveTo(x - w, y); g.lineTo(x, y - h * 0.38); g.lineTo(x + w, y); g.fill();
  }
}
function crystal(g, x, y, s, col, rgb) {
  softGlow(g, x, y - s * 0.6, s * 2.4, rgb, 0.35);
  for (const k of [-1, 1, 0]) {
    const h = s * (k ? 0.7 : 1.15), w = s * 0.2, cx = x + k * s * 0.3;
    g.fillStyle = col;
    g.beginPath(); g.moveTo(cx - w, y); g.lineTo(cx + k * s * 0.15, y - h); g.lineTo(cx + w, y); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath(); g.moveTo(cx - w * 0.3, y); g.lineTo(cx + k * s * 0.15, y - h); g.lineTo(cx, y); g.fill();
  }
}
// 땅: 흙 결, 돌, 위 테두리 (풀 / 수정 / 바위)
function ground(g, top, bottom, edge, edgeLight, R, kind, gw = W) {
  g.fillStyle = vgrad(g, GROUND, H, [[0, top], [1, bottom]]); g.fillRect(0, GROUND, gw, H - GROUND);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(0,0,0,${0.12 + R() * 0.2})`; g.fillRect(R() * gw, GROUND + 14 + R() * 60, 6 + R() * 20, 2); }
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,255,255,${0.03 + R() * 0.06})`; g.fillRect(R() * gw, GROUND + 14 + R() * 60, 3 + R() * 6, 2 + R() * 3); }
  g.fillStyle = edge; g.fillRect(0, GROUND, gw, 8);
  g.fillStyle = edgeLight; g.fillRect(0, GROUND, gw, 2);
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(0, GROUND + 8, gw, 3);
  if (kind === 'grass') {
    g.fillStyle = edge;
    for (let x = 0; x < gw; x += 4 + R() * 6) { const h = 3 + R() * 8; g.beginPath(); g.moveTo(x, GROUND + 1); g.lineTo(x + 2, GROUND - h); g.lineTo(x + 4, GROUND + 1); g.fill(); }
    for (let x = 0; x < gw; x += 30 + R() * 50) {           // 작은 꽃
      g.fillStyle = ['#ffd6e8', '#fff3b0', '#c9e7ff'][R() * 3 | 0]; g.fillRect(x, GROUND - 6, 3, 3);
    }
  } else if (kind === 'crystal') {
    for (let i = 0; i < 9; i++) crystal(g, R() * gw, GROUND + 2, 8 + R() * 8, R() < 0.5 ? '#7fe3ff' : '#c28cff', R() < 0.5 ? '120,220,255' : '190,130,255');
  } else if (kind === 'rock') {
    g.fillStyle = edge;
    for (let x = 0; x < gw; x += 30 + R() * 60) { const w = 10 + R() * 22, h = 4 + R() * 8; g.beginPath(); g.moveTo(x, GROUND + 1); g.lineTo(x + w * 0.3, GROUND - h); g.lineTo(x + w * 0.8, GROUND - h * 0.7); g.lineTo(x + w, GROUND + 1); g.fill(); }
  }
}

function bgDusk() {

  g.fillStyle = '#ffe6b0'; g.beginPath(); g.arc(690, 360, 44, 0, Math.PI * 2); g.fill();

let LAVA_CRACKS = [];

function bgHell() {

function deadTree(g, x, y, len, ang, depth) {
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  g.lineWidth = Math.max(1, depth * 1.6);
  g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
  if (depth > 0) { deadTree(g, x2, y2, len * 0.72, ang - 0.45, depth - 1); deadTree(g, x2, y2, len * 0.68, ang + 0.4, depth - 1); }
}

// 마을: 저녁 하늘, 집들, 우물, 울타리, 오른쪽 절벽에 던전 입구

function bamboo(g, x, R) {

    const bx = x + i * 9, h = 90 + R() * 70;
    g.fillStyle = i % 2 ? '#4f7a3a' : '#5f8f45'; g.fillRect(bx, GROUND - h, 5, h);
    g.fillStyle = '#3a5a2a'; for (let y = GROUND - h + 18; y < GROUND; y += 20) g.fillRect(bx - 1, y, 7, 2);
  }
}
function bgTownWorld() {                              // 땅과 집 (마을 넓이)

  house(g, 250, 100, 75, '#d8c3a0', '#3a5a8a');
  house(g, 1060, 120, 95, '#b8946c', '#5a7a3a');
  house(g, 1480, 110, 80, '#c9b08a', '#7a3a5a');
  house(g, 1900, 130, 100, '#a88a6a', '#3a4a7a');
  house(g, 2260, 100, 78, '#d0b890', '#8a5a2e');
  // 우물 (가운데 광장)
  g.fillStyle = '#7a7a86'; g.fillRect(1180, GROUND - 30, 50, 30);
  g.fillStyle = '#5a3a24'; g.fillRect(1182, GROUND - 70, 5, 40); g.fillRect(1223, GROUND - 70, 5, 40);
  g.fillStyle = '#8a3a2e'; g.beginPath(); g.moveTo(1172, GROUND - 66); g.lineTo(1205, GROUND - 88); g.lineTo(1238, GROUND - 66); g.fill();
  // 스승들 옆 꾸미기
  dummy(g, 1420); dummy(g, 1260);
  target(g, 1850); target(g, 1700);
  bamboo(g, 2070, R); bamboo(g, 2230, R);
  // 울타리
  g.fillStyle = '#7a5a3a';
  for (const [a, b] of [[400, 500], [800, 900], [1560, 1640], [2350, 2420]]) {
    for (let x = a; x < b; x += 16) g.fillRect(x, GROUND - 24, 5, 24);

  g.beginPath(); g.moveTo(cx + 780, GROUND); g.lineTo(cx + 790, 230); g.lineTo(cx + 840, 180); g.lineTo(cx + 900, 200); g.lineTo(TOWN_W, 150); g.lineTo(TOWN_W, GROUND); g.fill();
  g.fillStyle = '#3a3846';
  for (let i = 0; i < 40; i++) g.fillRect(cx + 790 + R() * 170, 200 + R() * 260, 10 + R() * 18, 6);
  const gx = GATE.x, gw = GATE.w, gy = GATE.y;
  g.fillStyle = '#56545f'; g.fillRect(gx - 14, gy - 4, gw + 28, GROUND - gy + 4);
  g.fillStyle = '#08070c';
  g.beginPath(); g.moveTo(gx, GROUND); g.lineTo(gx, gy + gw / 2); g.arc(gx + gw / 2, gy + gw / 2, gw / 2, Math.PI, 0); g.lineTo(gx + gw, GROUND); g.fill();
  softGlow(g, gx + gw / 2, GROUND - 40, 70, '120,60,200', 0.25);
  // 길 (돌바닥)

// 26~30층: 보라 마법의 성 (오로라 하늘, 탑, 빛나는 창문, 돌바닥)
function bgArcane() {
  const c = layer(), g = c.getContext('2d'), R = rng(909);
  g.fillStyle = vgrad(g, 0, GROUND, [[0, '#07031a'], [0.5, '#1d0b3a'], [1, '#3b1a5e']]); g.fillRect(0, 0, W, GROUND);
  for (let i = 0; i < 80; i++) { g.fillStyle = `rgba(230,210,255,${R() * 0.7})`; g.fillRect(R() * W, R() * 260, R() < 0.1 ? 2 : 1, R() < 0.1 ? 2 : 1); }
  for (let k = 0; k < 3; k++) {                                          // 오로라 띠
    g.strokeStyle = `rgba(${k ? '190,120,255' : '120,230,255'},0.12)`; g.lineWidth = 26 - k * 6;
    g.beginPath();
    for (let x = 0; x <= W; x += 10) g.lineTo(x, 90 + k * 30 + Math.sin(x * 0.008 + k) * 30 + Math.sin(x * 0.02) * 10);
    g.stroke();
  }
  softGlow(g, 720, 120, 120, '220,190,255', 0.35);                     // 보라 달
  g.fillStyle = '#e6d8ff'; g.beginPath(); g.arc(720, 120, 34, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#07031a'; g.beginPath(); g.arc(734, 112, 30, 0, Math.PI * 2); g.fill();
  ridge(g, 400, 40, 0.008, 4, '#2a1448');
  // 성 (탑과 벽)
  const towers = [[110, 70, 230], [250, 50, 170], [480, 90, 290], [660, 56, 200], [860, 70, 240]];
  for (const [tx, tw, th] of towers) {
    g.fillStyle = '#160a2a'; g.fillRect(tx - tw / 2, GROUND - th, tw, th);
    g.beginPath(); g.moveTo(tx - tw / 2 - 8, GROUND - th); g.lineTo(tx, GROUND - th - tw * 0.9); g.lineTo(tx + tw / 2 + 8, GROUND - th); g.fill();
    for (let y = GROUND - th + 24; y < GROUND - 40; y += 38) {          // 빛나는 창문
      if (R() < 0.35) continue;
      softGlow(g, tx, y + 8, 22, '200,140,255', 0.4);
      g.fillStyle = '#d9b3ff'; g.fillRect(tx - 4, y, 8, 14);
    }
  }
  g.fillStyle = '#1b0e33'; g.fillRect(0, GROUND - 90, W, 90);            // 성벽
  g.fillStyle = '#24123f';
  for (let x = 0; x < W; x += 30) g.fillRect(x, GROUND - 102, 18, 14);
  g.fillStyle = vgrad(g, 360, GROUND, [[0, 'rgba(170,110,255,0)'], [1, 'rgba(170,110,255,0.2)']]); g.fillRect(0, 360, W, GROUND - 360);
  ground(g, '#2a1d3e', '#0e0818', '#4a3570', '#c78cff', R, 'crystal');
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 2;                   // 돌바닥 줄
  for (let x = 0; x < W; x += 48) { g.beginPath(); g.moveTo(x, GROUND + 10); g.lineTo(x - 10, H); g.stroke(); }
  return c;
}

// 31~35층: 기계 공장 (철판 벽, 파이프, 톱니바퀴, 빛나는 환풍구, 경고 줄무늬)
function cog(g, x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 24; i++) { const a = i * Math.PI / 12, rr = i % 2 ? r : r * 1.18; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.fill();
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.arc(x, y, r * 0.35, 0, Math.PI * 2); g.fill();
}
function bgFactory() {
  const c = layer(), g = c.getContext('2d'), R = rng(1234);
  g.fillStyle = vgrad(g, 0, GROUND, [[0, '#05070c'], [0.6, '#141b26'], [1, '#26303f']]); g.fillRect(0, 0, W, GROUND);
  for (let x = 0; x < W; x += 120) {                                    // 철판 벽
    g.fillStyle = (x / 120) % 2 ? '#161d29' : '#1a2230'; g.fillRect(x, 60, 118, GROUND - 60);
    g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(x, 60, 2, GROUND - 60);
    g.fillStyle = '#2c3646';
    for (let y = 72; y < GROUND; y += 60) { g.fillRect(x + 8, y, 4, 4); g.fillRect(x + 106, y, 4, 4); }
  }
  for (let i = 0; i < 6; i++) cog(g, 60 + R() * (W - 120), 140 + R() * 200, 30 + R() * 40, i % 2 ? '#0f141c' : '#121821');
  for (let i = 0; i < 5; i++) {                                         // 빛나는 환풍구
    const x = 80 + i * 190, y = 200 + (i % 2) * 70;
    softGlow(g, x + 30, y + 10, 70, '255,140,60', 0.35);
    g.fillStyle = '#ff9a3c'; g.fillRect(x, y, 60, 20);
    g.fillStyle = '#3a2410'; for (let k = 0; k < 6; k++) g.fillRect(x + 4 + k * 10, y + 2, 3, 16);
  }
  for (const [y, h] of [[80, 18], [116, 10]]) {                         // 가로 파이프
    g.fillStyle = vgrad(g, y, y + h, [[0, '#6a7486'], [0.5, '#a8b2c2'], [1, '#3a4250']]); g.fillRect(0, y, W, h);
    g.fillStyle = '#2a303c'; for (let x = 40; x < W; x += 160) g.fillRect(x, y - 3, 10, h + 6);
  }
  for (const x of [230, 610, 820]) {                                     // 세로 파이프
    g.fillStyle = vgrad(g, 0, 1, [[0, '#4a5262'], [1, '#4a5262']]);
    const gr = g.createLinearGradient(x, 0, x + 16, 0); gr.addColorStop(0, '#3a4250'); gr.addColorStop(0.5, '#9aa4b4'); gr.addColorStop(1, '#2a303c');
    g.fillStyle = gr; g.fillRect(x, 80, 16, GROUND - 80);
  }
  for (let x = -20; x < W; x += 24) {                                    // 경고 줄무늬
    g.fillStyle = '#e8b320'; g.beginPath(); g.moveTo(x, GROUND - 14); g.lineTo(x + 12, GROUND - 14); g.lineTo(x + 24, GROUND); g.lineTo(x + 12, GROUND); g.fill();
    g.fillStyle = '#1a1a1a'; g.beginPath(); g.moveTo(x + 12, GROUND - 14); g.lineTo(x + 24, GROUND - 14); g.lineTo(x + 36, GROUND); g.lineTo(x + 24, GROUND); g.fill();
  }
  ground(g, '#2b313c', '#0c0f14', '#4a5260', '#ffb347', R, 'rock');
  g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 2;                    // 철판 바닥 줄
  for (let x = 0; x < W; x += 64) { g.beginPath(); g.moveTo(x, GROUND + 10); g.lineTo(x, H); g.stroke(); }
  return c;
}

const BGS = [bgDusk(), bgCave(), bgVolcano(), bgHell(), bgGrave(), bgTown(), bgArcane(), bgFactory()];
const SEC_BG = [0, 1, 2, 3, 4, 6, 7];   // 구역 → 배경 번호 (5번은 마을)
const TOWN_WORLD = bgTownWorld();   // 넓은 마을 땅
const VIGNETTE = makeVignette();
const stageNow = () => state === 'title' ? 0 : inTown() ? 5 : SEC_BG[section()];

// 떠다니는 빛: 반딧불(숲) / 반짝이는 먼지(동굴) / 불씨(화산)
let amb = [];
function updAmb(dt) {
  const st = stageNow();
  while (amb.length < 40) amb.push({ x: rand(0, W), y: rand(60, GROUND), ph: rand(0, 7), s: rand(1.5, 3.5), vx: rand(-15, 15), vy: rand(-30, -10) });
  for (const a of amb) {
    a.ph += dt;
    if (st === 0 || st === 4 || st === 5) { a.x += Math.sin(a.ph * 0.8) * 20 * dt; a.y += Math.cos(a.ph * 0.6) * 12 * dt; }
    else if (st === 1 || st === 6) { a.y += 14 * dt; a.x += Math.sin(a.ph) * 6 * dt; if (a.y > GROUND) { a.y = 30; a.x = rand(0, W); } }
    else { a.x += a.vx * dt; a.y += a.vy * 2 * dt; if (a.y < 0) { a.y = GROUND; a.x = rand(0, W); } }
  }
}
function drawAmb() {
  const st = stageNow(), rgb = ['220,255,140', '170,200,255', '255,150,60', '255,70,40', '170,230,255', '255,230,150', '200,150,255', '255,170,90'][st];
  ctx.globalCompositeOperation = 'lighter';
  for (const a of amb) {
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(a.ph * (st === 0 || st === 4 || st === 5 ? 1.5 : 3)));
    ctx.fillStyle = `rgba(${rgb},${0.15 * tw})`; ctx.beginPath(); ctx.arc(a.x, a.y, a.s * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(${rgb},${0.9 * tw})`; ctx.fillRect(a.x - a.s / 2, a.y - a.s / 2, a.s, a.s);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// 빛 번짐 (불, 해골, 도깨비불 뒤에)
function glow(x, y, r, rgb, a) {
  ctx.globalCompositeOperation = 'lighter';
  softGlow(ctx, x, y, r, rgb, a);
  ctx.globalCompositeOperation = 'source-over';
}
// 발밑 그림자. 높이 뜰수록 작고 옅게
function shadow(cx, bottom, w) {
  const up = clamp((GROUND - bottom) / 300, 0, 0.7);
  ctx.fillStyle = `rgba(0,0,0,${0.35 * (1 - up)})`;
  ctx.beginPath(); ctx.ellipse(cx, GROUND + 3, w * (1 - up * 0.6) / 2, 6 * (1 - up * 0.5), 0, 0, Math.PI * 2); ctx.fill();
}
// 야수의 불덩이: 빛 + 꼬리 + 흔들리는 불꽃
function drawFireball(s) {
  glow(s.x, s.y, 60, '255,110,30', 0.5);
  const ang = Math.atan2(s.vy, s.vx);
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(ang);
  ctx.fillStyle = 'rgba(255,90,20,0.45)'; ctx.beginPath(); ctx.ellipse(-16, 0, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.arc(0, 0, s.r + Math.sin(clock * 40) * 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe28a'; ctx.beginPath(); ctx.arc(2, 0, s.r * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// 해골 왕의 뼈다귀: 빙글빙글 돎
function drawBone(s) {
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(clock * 14);
  ctx.fillStyle = '#f2efe6'; ctx.fillRect(-12, -3, 24, 6);
  for (const e of [-12, 12]) for (const k of [-4, 4]) { ctx.beginPath(); ctx.arc(e, k, 4.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

// 검기 그리기: 빛나는 초승달
function drawBlades() {
  for (const b of blades) {
    const ang = Math.atan2(b.vy, b.vx);
    glow(b.x, b.y, 50, '150,210,255', 0.45);
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang);
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#9fd8ff';            // 꼬리
    ctx.beginPath(); ctx.ellipse(-26, 0, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#e8f6ff';                                     // 초승달
    ctx.beginPath(); ctx.arc(0, 0, 18, -Math.PI / 2, Math.PI / 2); ctx.arc(-7, 0, 15, Math.PI / 2, -Math.PI / 2, true); ctx.fill();
    ctx.strokeStyle = '#6fc3ff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
}

// 맞았을 때 퍼지는 고리
let rings = [], blades = [];
// 검기 칸 수와 다시 차는 시간은 maxAmmo(), ammoTime() (부속품으로 바뀜)
const ring = (x, y, col, max = 50) => rings.push({ x, y, col, max, t: 0 });

// ===== 그리기 =====
function draw() {
  ctx.imageSmoothingEnabled = false;   // 픽셀 그림을 또렷하게 (최근접)
  const pal = boss ? boss.pal : MAKERS[0]().pal;
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  // 배경 (흔들릴 때 가장자리가 비지 않게 조금 크게)
  const st = stageNow();
  ctx.fillStyle = pal.ground; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.drawImage(BGS[st], 0, 0);
  if (st === 2 || st === 3) {                       // 땅속 용암 금이 숨 쉬듯 빛남
    ctx.strokeStyle = `rgba(255,${110 + Math.sin(clock * 3) * 40 | 0},30,${0.6 + Math.sin(clock * 2) * 0.3})`;
    ctx.lineWidth = 2;
    for (const pts of LAVA_CRACKS) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }
    glow(W / 2, GROUND + 40, 500, '255,90,20', 0.12 + Math.sin(clock * 2) * 0.04);
  }
  drawAmb();
  if (inTown()) { ctx.translate(-Math.round(camX), 0); ctx.drawImage(TOWN_WORLD, 0, 0); }

  if (state === 'title') drawTitleCast();

  if (inTown()) { drawShopStall(); drawTownLive(); drawNPCs(); }
  if (state === 'floor' || (state === 'dead' && !boss)) drawDoor();

  if (state !== 'title') {
    // 그림자
    const bossShown = boss && state !== 'pick' && (state !== 'clear' || stateT < 0.6);   // 잡은 뒤에는 안 보임
    if (bossShown) shadow(boss.x + boss.w / 2, boss.y + boss.h, boss.w * 1.1);
    for (const s of mobs) shadow(s.x + s.w / 2, s.y + s.h, s.w);
    if (state !== 'dead' || stateT < 0.8) shadow(player.x + player.w / 2, player.y + player.h, 40);
    glow(player.x + player.w / 2, player.y + player.h / 2, job ? 80 : 70, job ? JOBS[job].col : '200,225,255', job ? 0.28 : 0.18);   // 기사가 배경에 묻히지 않게
    // 빛 번짐
    if (bossIdx === 1 && bossShown) glow(boss.x + boss.w / 2, boss.y + boss.h / 2, 150, '255,120,40', 0.35 + Math.sin(clock * 8) * 0.05);
    for (const s of shots) if (s.kind === 'wisp') glow(s.x, s.y, 50, '255,140,50', 0.45);
    if (bossShown && bossIdx === 2 && boss.st === 'throw') glow(boss.x + boss.w / 2, boss.y, 80, '255,140,50', 0.5);
    for (const b of bolts) if (b.t <= 0 && !b.hide) glow(b.x, GROUND - 40, 120, '255,120,40', 0.5);
    // 불기둥 예고 / 불기둥
    for (const b of bolts) {
      if (b.hide) continue;
      if (b.t > 0) {
        ctx.strokeStyle = `rgba(255,170,60,${0.35 + Math.sin(clock * 40) * 0.25})`;
        ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(b.x, 0); ctx.lineTo(b.x, GROUND); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,140,40,0.4)'; ctx.beginPath(); ctx.ellipse(b.x, GROUND, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        const fg = ctx.createLinearGradient(b.x - 20, 0, b.x + 20, 0);
        fg.addColorStop(0, 'rgba(255,80,20,0)'); fg.addColorStop(0.3, '#ff6a1f'); fg.addColorStop(0.5, '#fff1a8');
        fg.addColorStop(0.7, '#ff6a1f'); fg.addColorStop(1, 'rgba(255,80,20,0)');
        ctx.fillStyle = fg;
        const wob = Math.sin(clock * 50) * 3;
        ctx.fillRect(b.x - 20 + wob, 0, 40, GROUND);
      }
    }
    // 떨어지는 진흙 그림자
    for (const s of shots) if (s.kind === 'mud') {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(s.x, GROUND + 2, 18, 4, 0, 0, Math.PI * 2); ctx.fill();
    }

    if (boss && state === 'clear' && boss.drawDead) boss.drawDead(stateT);
    else if (bossShown) {
      if (state === 'clear') ctx.globalAlpha = 1 - stateT / 0.6;
      boss.draw();
      ctx.globalAlpha = 1;
    }

    // 보물상자
    if (chest) {
      const f = chest.t < 0.9 ? 0 : frameAt('chest', chest.t - 0.9);
      const drop = Math.max(0, 1 - chest.t / 0.4);
      if (!drawFrame('chest', f, chest.x, GROUND - drop * 200, 3)) box({ x: chest.x - 24, y: GROUND - 48, w: 48, h: 48 }, '#c84');
    }

    // 부하 몬스터
    for (const s of mobs) {
      const m = MOB[s.kind], flip = m.facesLeft ? s.dir > 0 : s.dir < 0;
      const y = m.fly ? s.y + s.h / 2 : s.y + s.h;
      if (s.kind === 'eye') glow(s.x + s.w / 2, y, 40, '255,60,60', 0.25);
      if (s.kind === 'wispm') glow(s.x + s.w / 2, y, 50, '255,140,50', 0.4);
      if (!drawAnim(m.walk, s.t, s.x + s.w / 2, y, m.scale, flip, s.flash > 0 ? 'brightness(3)' : null)) box(s, m.col);
      if (s.maxHp > 1 && s.hp < s.maxHp) {             // 잡몹 체력 줄
        const bw = 36, bx = s.x + s.w / 2 - bw / 2, by = s.y - 10;
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
        ctx.fillStyle = '#ff5a5a'; ctx.fillRect(bx, by, bw * clamp(s.hp / s.maxHp, 0, 1), 4);
      }
    }

    // 날아오는 것
    for (const s of shots) {
      if (s.kind === 'fire') { drawFireball(s); continue; }
      if (s.kind === 'bone') { drawBone(s); continue; }
      if (s.kind === 'arcane') { drawArcane(s); continue; }
      if (s.kind === 'laser') { drawLaser(s); continue; }
      if (s.kind === 'saw') { drawSaw(s); continue; }
      const ok = s.kind === 'wisp' ? drawAnim('wisp', clock, s.x, s.y, 1.5) : drawAnim('mud', clock, s.x, s.y, 2.5);
      if (!ok) { ctx.fillStyle = s.kind === 'wisp' ? '#ff7a2b' : '#6b4a2e'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
    }
    // 충격파
    for (const w of waves) {
      ctx.fillStyle = '#c9b8a0';
      ctx.beginPath(); ctx.moveTo(w.x - 14, GROUND); ctx.quadraticCurveTo(w.x + w.dir * 4, GROUND - 60, w.x + 14, GROUND); ctx.fill();
      ctx.fillStyle = '#fff3d6';
      ctx.beginPath(); ctx.moveTo(w.x - 7, GROUND); ctx.quadraticCurveTo(w.x, GROUND - 30, w.x + 7, GROUND); ctx.fill();
    }

    drawCoins();
    drawBlades();
    drawPlayer();
    drawParry();
  }

  for (const e of fx) drawAnim(e.key, e.t, e.x, e.y, e.scale, e.flip);
  for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2, 0, 1); ctx.fillStyle = q.col; ctx.fillRect(q.x, q.y, q.size, q.size); }
  for (const r of rings) {
    const k = r.t / 0.3;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.col; ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + k * r.max, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.drawImage(VIGNETTE, 0, 0);       // 가장자리를 살짝 어둡게
  if (fadeIn > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeIn})`; ctx.fillRect(0, 0, W, H); }
  drawHud();
}

// 첫 화면에 나오는 보스들
function drawTitleCast() {

// 패링 효과: 막는 동안 앞에 파란 방패 빛, 성공하면 하얀 고리, "패링!" 글자
function drawParry() {
  const p = player, cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (p.parry > 0) {
    ctx.strokeStyle = `rgba(140,220,255,${0.4 + p.parry / parryWindow() * 0.6})`; ctx.lineWidth = 5;
    ctx.beginPath();
    if (p.face > 0) ctx.arc(cx, cy, 38, -Math.PI * 0.45, Math.PI * 0.45);
    else ctx.arc(cx, cy, 38, Math.PI * 0.55, Math.PI * 1.45);
    ctx.stroke();
  }
  if (p.parryFlash > 0) {
    const k = 1 - p.parryFlash / 0.3;
    ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(cx, cy, 30 + k * 60, 0, Math.PI * 2); ctx.stroke();
  }
  for (const q of popups) {
    ctx.globalAlpha = clamp(1.4 - q.t * 2, 0, 1);
    text(q.str, q.x, q.y - q.t * 50, 26, '#9fe8ff');
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  const p = player;
  const S = 1.35, x = p.x + p.w / 2, y = p.y + p.h, flip = p.face < 0;
  // 지금 상황에 맞는 기사 그림 고르기
  let key, t = clock;
  if (state === 'dead') { key = 'heroDie'; t = stateT; }
  else if (p.parry > 0 || p.parryFlash > 0) { key = 'heroAtk'; t = 0; }   // 칼을 세워 막는 자세
  else if (p.atkT < atkCdNow() && !p.atkDown) { key = p.combo ? 'heroAtk' : 'heroAtk2'; t = p.atkT * (7 / atkCdNow()) / 14; } // 휘두르는 시간에 7프레임
  else if (p.hitAnimT < 0.33) { key = 'heroHit'; t = p.hitAnimT; }
  else if (!p.onGround) key = p.vy < 0 ? 'heroJump' : 'heroFall';
  else if (Math.abs(p.vx) > 1) { key = 'heroRun'; if (p.dash > 0) t = clock * 2; }
  else key = 'heroIdle';
  const blink = state !== 'dead' && p.parryFlash <= 0 && p.inv > 0 && Math.floor(p.inv * 20) % 2;
  if (!blink && drawAnim(key, t, x, y, S, flip, p.dash > 0 ? 'brightness(1.6)' : null)) {
    if (p.atk > 0 && !p.atkDown) {  // 무기마다 다른 색·크기의 베기 자국
      const wp = weapon(), r = 34 + 30 * wp.reach * (1 + 0.3 * pk('long')), a = p.atk / 0.16;
      ctx.strokeStyle = `rgba(${wp.col},${0.25 + a * 0.5})`; ctx.lineWidth = 4 + wp.dmg * 3; ctx.lineCap = 'round';
      ctx.beginPath();
      if (p.face > 0) ctx.arc(x, p.y + 26, r, -Math.PI * 0.42, Math.PI * 0.3); else ctx.arc(x, p.y + 26, r, Math.PI * 0.7, Math.PI * 1.42);
      ctx.stroke(); ctx.lineCap = 'butt';
    }
    if (p.atk > 0 && p.atkDown) {   // 아래 베기는 그림이 없어서 흰 선으로
      ctx.strokeStyle = `rgba(255,255,255,${0.4 + p.atk / 0.16 * 0.6})`; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x, p.y + p.h - 10, 40, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); ctx.lineCap = 'butt';
    }
    return;
  }
  if (blink) return;
  // 그림을 아직 못 불러왔을 때: 직접 그린 기사
  {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y);
    ctx.scale(p.face, 1);
    ctx.fillStyle = '#b03a48'; ctx.fillRect(-16, 14, 10, 24);          // 망토
    ctx.fillStyle = '#4a5568'; ctx.fillRect(-10, 34, 8, 10); ctx.fillRect(2, 34, 8, 10); // 다리
    ctx.fillStyle = '#c9d1d9'; ctx.fillRect(-12, 14, 24, 22);          // 갑옷
    ctx.fillStyle = '#9aa5b1'; ctx.fillRect(-11, -2, 22, 18);          // 투구
    ctx.fillStyle = '#1a202c'; ctx.fillRect(0, 5, 10, 4);              // 눈구멍
    ctx.fillStyle = '#e53e3e'; ctx.fillRect(-4, -9, 6, 8);             // 깃털
    if (p.atk <= 0) {                                                  // 쉬는 칼
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(12, 4, 4, 26);
      ctx.fillStyle = '#d69e2e'; ctx.fillRect(9, 26, 10, 3);
    }
    ctx.restore();
  }
  if (p.atk > 0) {
    const a = p.atk / 0.16;
    ctx.strokeStyle = `rgba(255,255,255,${0.4 + a * 0.6})`; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    const cx = p.x + p.w / 2;
    if (p.atkDown) ctx.arc(cx, p.y + p.h - 10, 40, Math.PI * 0.15, Math.PI * 0.85);
    else if (p.face > 0) ctx.arc(cx, p.y + 22, 52, -Math.PI * 0.4, Math.PI * 0.35);
    else ctx.arc(cx, p.y + 22, 52, Math.PI * 0.65, Math.PI * 1.4);
    ctx.stroke(); ctx.lineCap = 'butt';
  }
}

function heart(x, y, s, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
  ctx.fill();
}

function text(str, x, y, size, col, align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
